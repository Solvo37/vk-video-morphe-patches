name: Security cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  delete-exposed-run:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow run containing an unmasked derived credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE             "repos/$GITHUB_REPOSITORY/actions/runs/35453760950"
