name: Validate profile promo blocker 1.163.5

on:
  push:
    branches:
      - fix/1.163.5-startup-crash
    paths:
      - '.github/workflows/validate-profile-promo-1.163.5.yml'

permissions:
  contents: read
  packages: read

env:
  BASE_APK_SHA256: 0fc1ca90f018233283fb9b134674279b1eb2f8968f38678d43933fd014b3aaa2
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'
      - name: Install verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner jq unzip
      - name: Build 0.2.6 bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gradle :patches:buildAndroid --no-daemon
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          cp "$MPP" work.mpp
          grep -q '^version = 0.2.6$' gradle.properties
      - name: Download tested RC base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 1.163.5-rc1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.5-rc1-patched.apk'
          echo "$BASE_APK_SHA256  VK-Video-1.163.5-rc1-patched.apk" | sha256sum -c -
      - name: Download pinned Morphe
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o morphe.jar "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "$MORPHE_SHA256  morphe.jar" | sha256sum -c -
      - name: Apply only profile promo blocker
        run: |
          set -euo pipefail
          mkdir -p dist
          "$JAVA_HOME/bin/java" -jar morphe.jar patch             -p work.mpp             --force --exclusive             -e "Hide profile ad-free promo"             --bytecode-mode STRIP_FAST             --unsigned             -r dist/patch-result.json             -o dist/validated-unsigned.apk             VK-Video-1.163.5-rc1-patched.apk

          cat dist/patch-result.json
          jq -e '
            all(.patchingSteps[]?; .success == true)
            and ((.failedPatches // []) | length == 0)
            and any(.appliedPatches[]?; .name == "Hide profile ad-free promo")
          ' dist/patch-result.json >/dev/null
      - name: Validate output
        run: |
          set -euo pipefail
          unzip -t dist/validated-unsigned.apk >/dev/null
          zipalign -c -p 4 dist/validated-unsigned.apk
          BADGING="$(aapt dump badging dist/validated-unsigned.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='com.vk.vkvideo'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"
          aapt dump xmltree dist/validated-unsigned.apk AndroidManifest.xml > dist/manifest.txt
          python ci/verify_manifest.py dist/manifest.txt
          python ci/verify_patched_apk.py dist/validated-unsigned.apk --json-out dist/static-gate.json
