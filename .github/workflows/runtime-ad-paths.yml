name: Trace runtime ad mappers

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/runtime-ad-paths.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download APK and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf runtime-ad
          mkdir -p runtime-ad docs
          gh release download 1.163 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163-patched.apk' --dir runtime-ad
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o runtime-ad/jadx.zip
          unzip -q runtime-ad/jadx.zip -d runtime-ad/jadx
          chmod +x runtime-ad/jadx/bin/jadx

      - name: Decompile Java sources
        run: |
          set -euo pipefail
          runtime-ad/jadx/bin/jadx \
            --no-res \
            --no-debug-info \
            --show-bad-code \
            -j 4 \
            -d runtime-ad/out \
            runtime-ad/VK-Video-1.163-patched.apk >/tmp/jadx.log 2>&1 || true
          tail -n 30 /tmp/jadx.log
          test -d runtime-ad/out/sources

      - name: Trace ad DTO consumers and CTA construction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("runtime-ad/out/sources")
          out = Path("docs/runtime-ad-paths-1.163.txt")

          needles = [
              "ShortVideoFeedItemShortVideoMytargetSdk",
              "ShortVideoFeedItemShortVideoStaticAdDto",
              "ShortVideoFeedItemShortVideoMarketAdDto",
              "ShortVideoFeedItemShortVideoFloatingAdDto",
              "ShortVideoAdActionButtonDto",
              "SdkActionLink",
              "VideoVideoAdsInstreamSectionsDto",
              "VideoVideoAdsInstreamSectionDto",
              "VideoGetAdsResponseDto",
              "VideoVideoAdsMobileInstreamadsDto",
              "isMidrollPoint",
              "InstreamAdEngine",
              "VideoAdvertisementsComponent",
          ]

          candidates = {}
          for path in root.rglob("*.java"):
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue
              hits = [n for n in needles if n in text]
              if hits:
                  candidates[path] = (text, hits)

          with out.open("w", encoding="utf-8") as f:
              f.write(f"# Candidate Java files: {len(candidates)}\n\n")
              for path, (text, hits) in sorted(candidates.items(), key=lambda kv: str(kv[0])):
                  rel = path.relative_to(root)
                  f.write(f"===== {rel} =====\n")
                  f.write("HITS: " + ", ".join(hits) + "\n")
                  lines = text.splitlines()
                  match_lines = []
                  for i, line in enumerate(lines):
                      if any(n in line for n in needles):
                          match_lines.append(i)
                  # Merge nearby windows so method/class context stays readable.
                  windows = []
                  for i in match_lines:
                      a, b = max(0, i-24), min(len(lines), i+40)
                      if windows and a <= windows[-1][1] + 5:
                          windows[-1] = (windows[-1][0], max(windows[-1][1], b))
                      else:
                          windows.append((a,b))
                  for a,b in windows[:20]:
                      f.write(f"--- lines {a+1}-{b} ---\n")
                      for j in range(a,b):
                          f.write(f"{j+1:05d}: {lines[j]}\n")
                  f.write("\n")

          print(out, out.stat().st_size)
          PY

      - name: Commit trace report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime-ad-paths-1.163.txt
          git commit -m 'analysis: trace runtime ad mappers and CTA paths' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
