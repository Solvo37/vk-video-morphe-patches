name: Experimental clip ads build

on:
  push:
    branches:
      - exp/clip-ads-0.2.1
    paths:
      - 'patches/**'
      - '.github/workflows/experimental-clip-ads.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PROJECT_CERT_SHA256: d41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Install Android tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq

      - name: Build experimental MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Download Morphe and tested Variant 5 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work

          curl -fL --retry 4 \
            -o work/morphe.jar \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "${MORPHE_SHA256}  work/morphe.jar" | sha256sum -c -

          gh release download 1.163 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'VK-Video-1.163-patched.apk' \
            --dir work

          mv work/VK-Video-1.163-patched.apk work/base-variant5.apk

          CERT="$(apksigner verify --print-certs work/base-variant5.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "${PROJECT_CERT_SHA256}" ]]

      - name: Apply only new Clips ad patch
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"

          "$JAVA_HOME/bin/java" -Xmx6g -jar work/morphe.jar patch \
            -p "$MPP" \
            --force \
            --exclusive \
            -e "Remove clip ads" \
            --bytecode-mode STRIP_FAST \
            --unsigned \
            -r work/clip-patch-result.json \
            -o work/clip-unsigned.apk \
            work/base-variant5.apk

          jq -e '(.failedPatches | length) == 0' work/clip-patch-result.json >/dev/null
          jq -e 'any(.appliedPatches[]?; .name == "Remove clip ads")' work/clip-patch-result.json >/dev/null

      - name: Sign test APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$KEYSTORE_B64"

          printf '%s' "$KEYSTORE_B64" | base64 -d > work/signing.jks

          zipalign -f -p 4 work/clip-unsigned.apk work/clip-aligned.apk

          apksigner sign \
            --ks work/signing.jks \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out work/VK-Video-1.163-TEST-clip-ads-v2.apk \
            work/clip-aligned.apk

          zipalign -c -p 4 work/VK-Video-1.163-TEST-clip-ads-v2.apk

          VERIFY="$(apksigner verify --verbose --print-certs work/VK-Video-1.163-TEST-clip-ads-v2.apk)"
          echo "$VERIFY"
          grep -q 'Verified using v1 scheme (JAR signing): false' <<< "$VERIFY"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' <<< "$VERIFY"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$VERIFY"

          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" \
            | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "${PROJECT_CERT_SHA256}" ]]

          aapt dump badging work/VK-Video-1.163-TEST-clip-ads-v2.apk | head -n1
          sha256sum work/VK-Video-1.163-TEST-clip-ads-v2.apk \
            | tee work/VK-Video-1.163-TEST-clip-ads-v2.sha256

      - name: Upload experimental APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-1.163-test-clip-ads-v2
          path: |
            work/VK-Video-1.163-TEST-clip-ads-v2.apk
            work/VK-Video-1.163-TEST-clip-ads-v2.sha256
            work/clip-patch-result.json
          if-no-files-found: error
          retention-days: 7
