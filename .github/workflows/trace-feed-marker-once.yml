name: One-off trace FeedItem ad marker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-feed-marker-once.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/dex
          gh release download 1.163.2 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.2-patched.apk' --dir work
          cd work/dex
          unzip -q ../VK-Video-1.163.2-patched.apk 'classes*.dex'
      - name: Print exact xrefs
        run: |
          set -euo pipefail
          DEXDUMP="$(find "$ANDROID_SDK_ROOT/build-tools" -type f \( -name dexdump -o -name dexdump.exe \) | sort -V | tail -n1)"
          export DEXDUMP
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          needles=[
            'Lcom/vk/clips/sdk/shared/feed/model/FeedItem$c;',
            'Lcom/vk/clips/sdk/shared/feed/model/FeedItem$a;',
            'Lcom/vk/clips/sdk/shared/feed/model/FeedItem$h;',
            'Lcom/vk/clips/sdk/shared/feed/model/FeedItem$k;',
            'ads_controls_item_key',
          ]
          dexexe=os.environ['DEXDUMP']
          desc_re=re.compile(r"Class descriptor\s*:\s*'([^']+)'")
          meth_re=re.compile(r"\]\s+([^\s]+\.[^:]+):")
          rows=[]
          for dex in sorted(Path('work/dex').glob('classes*.dex')):
            p=subprocess.Popen([dexexe,'-d',str(dex)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,encoding='utf-8',errors='replace')
            cls=''; meth=''; ring=[]
            for line in p.stdout:
              m=desc_re.search(line)
              if m: cls=m.group(1)
              mm=meth_re.search(line)
              if mm: meth=mm.group(1)
              if any(n in line for n in needles):
                rows.append((dex.name,cls,meth,line.strip(),''.join(ring[-12:])))
              ring.append(line)
              if len(ring)>24:ring.pop(0)
            p.wait()
          print('TOTAL',len(rows))
          seen=set()
          for dex,cls,meth,line,ctx in rows:
            key=(dex,cls,meth)
            if key in seen: continue
            seen.add(key)
            print('\n###',dex,cls,meth)
            print(ctx)
            print('MATCH',line)
          PY
