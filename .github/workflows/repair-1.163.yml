name: Repair VK Video 1.163 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-1.163.yml'

permissions:
  contents: write
  packages: read

jobs:
  repair:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Install Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner aapt

      - name: Download current 1.163 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repair-input
          gh release download 1.163             --repo "$GITHUB_REPOSITORY"             --pattern 'VK-Video-1.163-patched.apk'             --dir repair-input
          test -s repair-input/VK-Video-1.163-patched.apk
          sha256sum repair-input/VK-Video-1.163-patched.apk

      - name: Build current Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Download Morphe Desktop
        run: |
          set -euo pipefail
          curl -fL --retry 4             -o morphe.jar             'https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar'
          echo '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  morphe.jar' | sha256sum -c -

      - name: Apply only stock-VK install conflict fix
        run: |
          set -euo pipefail
          mkdir -p repair-output
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"

          java -jar morphe.jar patch             -p "$MPP"             --force             --exclusive             -e 'Fix install conflict with stock VK'             --bytecode-mode FULL             --unsigned             -o repair-output/VK-Video-1.163-fixed-unsigned.apk             repair-input/VK-Video-1.163-patched.apk

      - name: Sign repaired APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > signing.jks
          test -s signing.jks

          apksigner sign             --ks signing.jks             --ks-pass env:STORE_PASSWORD             --ks-key-alias "$KEY_ALIAS"             --key-pass env:KEY_PASSWORD             --out repair-output/VK-Video-1.163-patched.apk             repair-output/VK-Video-1.163-fixed-unsigned.apk

          apksigner verify --verbose --print-certs repair-output/VK-Video-1.163-patched.apk
          aapt dump badging repair-output/VK-Video-1.163-patched.apk | head -n1
          sha256sum repair-output/VK-Video-1.163-patched.apk             | tee repair-output/VK-Video-1.163-patched.sha256

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload 1.163             repair-output/VK-Video-1.163-patched.apk             repair-output/VK-Video-1.163-patched.sha256             --clobber             --repo "$GITHUB_REPOSITORY"

          gh release edit 1.163             --repo "$GITHUB_REPOSITORY"             --title 'VK Video 1.163 patched'             --notes 'Repaired build: includes the Morphe stock-VK coexistence fix, so the re-signed VK Video APK can be installed alongside the official VK app.'
