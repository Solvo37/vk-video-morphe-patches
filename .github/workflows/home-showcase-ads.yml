name: Trace home showcase ads

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/home-showcase-ads.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download APK and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf homeads
          mkdir -p homeads docs
          gh release download 1.163.3 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.3-patched.apk' --dir homeads
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o homeads/jadx.zip
          unzip -q homeads/jadx.zip -d homeads/jadx
          chmod +x homeads/jadx/bin/jadx
      - name: Decompile APK
        run: |
          set -euo pipefail
          homeads/jadx/bin/jadx --no-res --show-bad-code -j 4 -d homeads/out homeads/VK-Video-1.163.3-patched.apk >/tmp/jadx-homeads.log 2>&1 || true
          test -d homeads/out/sources
      - name: Extract showcase ad paths
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('homeads/out/sources')
          out=Path('docs/home-showcase-ads-1.163.3.txt')
          needles=[
            'AdShowCaseBannerVh','ads_showcase','showcase_ad','nativeads_',
            'AdsShit','ShitAttachment','Sponsored','advertiserInfoUrl',
            'adMarker','AdsItemBlock','AdsDataProvider','native ad','nativeAd',
            'Реклама','VideoDiscoverAdsDto','CatalogBlockVariant'
          ]
          matches=[]
          for p in root.rglob('*.java'):
            try:t=p.read_text('utf-8',errors='replace')
            except:continue
            hits=[n for n in needles if n in t]
            if not hits: continue
            score=sum(t.count(h) for h in hits)
            if 'AdShowCaseBannerVh' in t: score+=50
            if 'advertiserInfoUrl' in t: score+=20
            if 'adMarker' in t: score+=20
            matches.append((score,p,t,hits))
          matches.sort(key=lambda x:(-x[0],str(x[1])))
          with out.open('w',encoding='utf-8') as f:
            f.write(f'# files={len(matches)}\n\n')
            for score,p,t,hits in matches[:220]:
              lines=t.splitlines()
              f.write(f'===== {p.relative_to(root)} score={score} =====\nHITS: {", ".join(hits)}\n')
              idxs=[i for i,l in enumerate(lines) if any(h in l for h in hits)]
              windows=[]
              for i in idxs:
                a,b=max(0,i-35),min(len(lines),i+70)
                if windows and a<=windows[-1][1]+5: windows[-1]=(windows[-1][0],max(windows[-1][1],b))
                else: windows.append((a,b))
              for a,b in windows[:20]:
                f.write(f'--- lines {a+1}-{b} ---\n')
                for j in range(a,b):
                  f.write(f'{j+1:05d}: {lines[j]}\n')
              f.write('\n')
          print(out, out.stat().st_size)
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/home-showcase-ads-1.163.3.txt
          git commit -m 'analysis: trace home showcase ads' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
