name: Dev Candidate APK

on:
  push:
    branches: [dev/0.3-stability]
    paths:
      - '.github/workflows/dev-candidate.yml'
      - 'ci/dump_dex_methods.py'
      - 'patches/src/main/kotlin/dev/solvo37/vkvideopatches/RuntimeSettingsPatch.kt'
      - 'extensions/vk-video/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-candidate-apk
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.vk.vkvideo
  BASE_TAG: 1.163.6
  BASE_APK: VK-Video-1.163.6-patched.apk
  BASE_SHA256: 404af6d2ddad48cf3e6531223db1c8bc7ae4f36640c6b7dafaebf90269728f54
  PROJECT_CERT_SHA256: d41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  candidate:
    if: github.repository == 'Solvo37/vk-video-morphe-patches' && github.ref == 'refs/heads/dev/0.3-stability'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Setup Android verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq unzip

          test -n "${ANDROID_HOME:-}"
          ZIPALIGN_BIN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign | sort -V | tail -n1)"
          APKSIGNER_BIN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          AAPT_BIN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"

          test -x "$ZIPALIGN_BIN"
          test -x "$APKSIGNER_BIN"
          test -x "$AAPT_BIN"

          echo "ZIPALIGN_BIN=$ZIPALIGN_BIN" >> "$GITHUB_ENV"
          echo "APKSIGNER_BIN=$APKSIGNER_BIN" >> "$GITHUB_ENV"
          echo "AAPT_BIN=$AAPT_BIN" >> "$GITHUB_ENV"

          echo "Using zipalign: $ZIPALIGN_BIN"
          "$ZIPALIGN_BIN" -h 2>&1 | head -n 3 || true
          echo "Using apksigner: $APKSIGNER_BIN"
          "$APKSIGNER_BIN" version

      - name: Build 0.3 development patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gradle :patches:buildAndroid --no-daemon
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          cp "$MPP" dev.mpp
          grep -q '^version = 0.3.0-alpha1$' gradle.properties

      - name: Download verified stable base
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 4 \
            -o "dist/$BASE_APK" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$BASE_TAG/$BASE_APK"
          echo "$BASE_SHA256  dist/$BASE_APK" | sha256sum -c -

          VERIFY="$("$APKSIGNER_BIN" verify --verbose --print-certs "dist/$BASE_APK")"
          printf '%s\n' "$VERIFY"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "$PROJECT_CERT_SHA256" ]]

          BADGING="$("$AAPT_BIN" dump badging "dist/$BASE_APK" | head -n1)"
          echo "$BADGING"
          grep -q "name='$PACKAGE_NAME'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"

      - name: Inspect VK application methods
        run: |
          set -euo pipefail
          python ci/dump_dex_methods.py \
            "dist/$BASE_APK" \
            'Lcom/vk/video/app/VkVideoApplication;' \
            | tee dist/vk-video-application-methods.txt

      - name: Download pinned Morphe
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            -o morphe.jar \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/$MORPHE_VERSION/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "$MORPHE_SHA256  morphe.jar" | sha256sum -c -

      - name: Apply 0.3 alpha delta
        run: |
          set -euo pipefail

          "$JAVA_HOME/bin/java" -jar morphe.jar patch \
            -p dev.mpp \
            --force \
            --exclusive \
            -e "Runtime settings foundation" \
            -e "Disable ad-free subscription promo" \
            --bytecode-mode STRIP_FAST \
            --unsigned \
            -r dist/patch-result.json \
            -o dist/dev-unsigned.apk \
            "dist/$BASE_APK"

          cat dist/patch-result.json

          jq -e '
            ((.patchingSteps // []) | length) > 0
            and all(.patchingSteps[]?; .success == true)
            and ((.failedPatches // []) | length == 0)
            and any(.appliedPatches[]?; .name == "Runtime settings foundation")
            and any(.appliedPatches[]?; .name == "Disable ad-free subscription promo")
          ' dist/patch-result.json >/dev/null

      - name: Static gate
        run: |
          set -euo pipefail
          unzip -t dist/dev-unsigned.apk >/dev/null
          "$AAPT_BIN" dump xmltree dist/dev-unsigned.apk AndroidManifest.xml > dist/manifest-xmltree.txt
          python ci/verify_manifest.py dist/manifest-xmltree.txt
          python ci/verify_patched_apk.py dist/dev-unsigned.apk --json-out dist/static-gate.json

          grep -q 'dev.solvo37.vkvideopatches.extension.PatchedSettingsActivity' dist/manifest-xmltree.txt
          grep -q 'android.intent.action.MAIN' dist/manifest-xmltree.txt
          grep -q 'android.intent.category.LAUNCHER' dist/manifest-xmltree.txt

      - name: Decode project signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing.jks
          test -s signing.jks

      - name: Align development candidate
        run: |
          set -euo pipefail
          echo "Trying page-aligned dev APK..."
          set +e
          "$ZIPALIGN_BIN" -v -f -p 4 dist/dev-unsigned.apk dist/dev-aligned.apk
          PAGE_STATUS=$?
          set -e

          if [[ "$PAGE_STATUS" -eq 0 ]]; then
            echo "page" > dist/alignment-mode.txt
            "$ZIPALIGN_BIN" -c -p 4 dist/dev-aligned.apk
            echo "Page alignment OK."
          else
            echo "::warning::zipalign -p failed with status $PAGE_STATUS; retrying standard 4-byte alignment for development candidate only."
            rm -f dist/dev-aligned.apk
            "$ZIPALIGN_BIN" -v -f 4 dist/dev-unsigned.apk dist/dev-aligned.apk
            test -s dist/dev-aligned.apk
            "$ZIPALIGN_BIN" -c 4 dist/dev-aligned.apk
            echo "standard" > dist/alignment-mode.txt
            echo "Standard 4-byte alignment OK."
          fi

      - name: Sign development candidate
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          OUT="dist/VK-Video-1.163-0.3.0-alpha1-dev.apk"

          echo "Signing dev APK..."
          "$APKSIGNER_BIN" sign \
            --ks signing.jks \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT" \
            dist/dev-aligned.apk

          echo "Signature written."
          test -s "$OUT"

          ALIGNMENT_MODE="$(cat dist/alignment-mode.txt)"
          if [[ "$ALIGNMENT_MODE" == "page" ]]; then
            "$ZIPALIGN_BIN" -c -p 4 "$OUT"
          else
            "$ZIPALIGN_BIN" -c 4 "$OUT"
          fi

          VERIFY="$("$APKSIGNER_BIN" verify --verbose --print-certs "$OUT")"
          printf '%s\n' "$VERIFY"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "$PROJECT_CERT_SHA256" ]]

          BADGING="$("$AAPT_BIN" dump badging "$OUT" | head -n1)"
          echo "$BADGING"
          grep -q "name='$PACKAGE_NAME'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"

          python ci/verify_patched_apk.py "$OUT" --json-out dist/final-gate.json
          sha256sum "$OUT" | tee dist/VK-Video-1.163-0.3.0-alpha1-dev.sha256

      - name: Build candidate metadata
        run: |
          set -euo pipefail
          FINAL_SHA="$(cut -d' ' -f1 dist/VK-Video-1.163-0.3.0-alpha1-dev.sha256)"

          jq -n \
            --arg package "$PACKAGE_NAME" \
            --arg version_name "1.163" \
            --argjson version_code 51920 \
            --arg patch_bundle_version "0.3.0-alpha1" \
            --arg base_tag "$BASE_TAG" \
            --arg base_sha256 "$BASE_SHA256" \
            --arg final_sha256 "$FINAL_SHA" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              development_only: true,
              package: $package,
              version_name: $version_name,
              version_code: $version_code,
              patch_bundle_version: $patch_bundle_version,
              base_release_tag: $base_tag,
              base_apk_sha256: $base_sha256,
              final_apk_sha256: $final_sha256,
              applied_delta_patches: [
                "Runtime settings foundation",
                "Disable ad-free subscription promo"
              ],
              temporary_settings_launcher: true,
              published_to_releases: false,
              workflow_run: $workflow_run
            }' > dist/dev-candidate-metadata.json

      - name: Upload candidate artifact only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-0.3.0-alpha1-dev-candidate
          path: |
            dist/VK-Video-1.163-0.3.0-alpha1-dev.apk
            dist/VK-Video-1.163-0.3.0-alpha1-dev.sha256
            dist/dev-candidate-metadata.json
            dist/patch-result.json
            dist/static-gate.json
            dist/final-gate.json
            dist/manifest-xmltree.txt
            dist/alignment-mode.txt
            dev.mpp
          if-no-files-found: error
