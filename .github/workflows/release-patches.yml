name: Publish Morphe patch bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/release-patches.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: publish-patches
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Verify repository metadata
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          [[ "$(jq -r '.version' patches-list.json)" == "$VERSION" ]]

      - name: Build MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Publish patch bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          TAG="patches-v$VERSION"
          ASSET_NAME="vk-video-morphe-patches-$VERSION.mpp"

          mkdir -p dist
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          cp "$MPP" "dist/$ASSET_NAME"

          NOTES="Standalone Morphe patch bundle for VK Video.

          Includes the stock-VK coexistence fix, ARM64 native signature-check bypass and user-selectable VK Video patches.

          Patch-only releases are marked as prereleases so the latest stable GitHub release remains the installable VK Video APK."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG"               --repo "$GITHUB_REPOSITORY"               --title "Morphe patches v$VERSION"               --notes "$NOTES"               --prerelease
          else
            gh release create "$TAG"               "dist/$ASSET_NAME#Morphe patch bundle"               --repo "$GITHUB_REPOSITORY"               --title "Morphe patches v$VERSION"               --notes "$NOTES"               --prerelease
          fi

          # Keep all historical patch-only releases out of GitHub's "Latest" stable slot.
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" ]] && continue
            gh release edit "$old_tag" --repo "$GITHUB_REPOSITORY" --prerelease || true
          done < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName               --jq '.[] | select(.tagName | startswith("patches-v")) | .tagName'
          )

          # Also attach the newest patch bundle to the latest stable app release.
          APP_TAG="$(
            gh release list               --repo "$GITHUB_REPOSITORY"               --limit 100               --json tagName,isDraft,isPrerelease,publishedAt               --jq '[.[] |
                select(.isDraft == false) |
                select(.isPrerelease == false) |
                select(.tagName | test("^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:-[0-9]+)?$"))
              ] | sort_by(.publishedAt) | last | .tagName // empty'
          )"

          if [[ -n "$APP_TAG" ]]; then
            gh release upload "$APP_TAG" "dist/$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          fi

          PUBLISHED_AT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"

          jq -n             --arg version "$VERSION"             --arg created_at "$PUBLISHED_AT"             --arg description "VK Video Morphe patches with stock-VK coexistence and native signature bypass"             --arg download_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET_NAME"             '{
              created_at: $created_at,
              description: $description,
              download_url: $download_url,
              signature_download_url: "",
              version: $version
            }' > patches-bundle.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update patch bundle metadata [skip ci]"
            git push
          fi
