name: Publish Morphe patch bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'patches-bundle.json'
      - '.github/workflows/release-patches.yml'

permissions:
  contents: write
  packages: read

jobs:
  publish:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Publish patch bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          TAG="patches-v$VERSION"
          mkdir -p dist
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          ASSET="dist/vk-video-morphe-patches-$VERSION.mpp"
          cp "$MPP" "$ASSET"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Morphe patches v$VERSION"               --notes "Standalone Morphe patch bundle. This release contains no VK Video APK."
          else
            gh release create "$TAG" "$ASSET#Morphe patch bundle"               --repo "$GITHUB_REPOSITORY"               --title "Morphe patches v$VERSION"               --notes "Standalone Morphe patch bundle. This release contains no VK Video APK."
          fi
