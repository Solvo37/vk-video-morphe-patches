name: Extract VideoFeatures ad-free fields

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/video-features-adfree.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download RC and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf vf
          mkdir -p vf docs
          gh release download 1.163.5-rc1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.5-rc1-patched.apk' --dir vf
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o vf/jadx.zip
          unzip -q vf/jadx.zip -d vf/jadx
          chmod +x vf/jadx/bin/jadx
      - name: Decompile VideoFeatures
        run: |
          set -euo pipefail
          vf/jadx/bin/jadx --no-res --show-bad-code             --single-class 'com.vk.toggle.features.VideoFeatures'             --single-class-output docs/video-features-1.163.5-rc1.txt             vf/VK-Video-1.163.5-rc1-patched.apk >/dev/null 2>&1
          grep -nE 'AD_FREE|TRIAL|ADS_' docs/video-features-1.163.5-rc1.txt || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/video-features-1.163.5-rc1.txt
          git commit -m 'analysis: extract VideoFeatures ad-free fields' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
