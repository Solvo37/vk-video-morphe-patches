name: Decompile exact remaining ad classes

on:
  push:
    branches: [ad-analysis-1.163]
    paths:
      - '.github/workflows/exact-remaining-ad-classes.yml'

permissions:
  contents: write

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf exact-rem
          mkdir -p exact-rem docs
          gh release download 1.163.1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.1-patched.apk' --dir exact-rem
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o exact-rem/jadx.zip
          unzip -q exact-rem/jadx.zip -d exact-rem/jadx
          chmod +x exact-rem/jadx/bin/jadx
      - name: Decompile exact classes
        run: |
          set -euo pipefail
          J=exact-rem/jadx/bin/jadx
          APK=exact-rem/VK-Video-1.163.1-patched.apk
          OUT=docs/exact-remaining-ad-classes-1.163.txt
          : > "$OUT"
          n=0
          for cls in             ee1.j             x13.e             n33.t             com.vk.api.generated.shortVideo.dto.ShortVideoGetRecomResponseDto             'com.vk.api.generated.shortVideo.dto.ShortVideoRecomFeedItemDto$Deserializer'; do
            n=$((n+1))
            echo "===== $cls =====" >> "$OUT"
            if "$J" --no-res --show-bad-code --single-class "$cls" --single-class-output "exact-rem/$n.java" "$APK" >/tmp/jadx-exact.log 2>&1; then
              cat "exact-rem/$n.java" >> "$OUT"
            else
              echo DECOMPILE_FAILED >> "$OUT"
              tail -n 30 /tmp/jadx-exact.log >> "$OUT" || true
            fi
            echo >> "$OUT"
          done
          wc -c "$OUT"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/exact-remaining-ad-classes-1.163.txt
          git commit -m 'analysis: decompile exact remaining ad classes' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
