name: Extract profile ad-free holder

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/profile-adfree-holder.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download RC and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf holder
          mkdir -p holder/out docs
          gh release download 1.163.5-rc1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.5-rc1-patched.apk' --dir holder
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o holder/jadx.zip
          unzip -q holder/jadx.zip -d holder/jadx
          chmod +x holder/jadx/bin/jadx
      - name: Decompile exact holder
        run: |
          set -euo pipefail
          APK='holder/VK-Video-1.163.5-rc1-patched.apk'
          J='holder/jadx/bin/jadx'
          OUT='docs/profile-adfree-holder-1.163.5-rc1.txt'
          : > "$OUT"
          classes=(
            'com.vk.video.screens.profile.adapter.holder.VideoAdFreeSubscriptionMenuHolder'
            'com.vk.video.screens.profile.adapter.holder.VideoAdFreeSubscriptionMenuHolder$loadSubscriptionState$1'
          )
          n=0
          for cls in "${classes[@]}"; do
            n=$((n+1))
            echo "===== $cls =====" >> "$OUT"
            if "$J" --no-res --show-bad-code --single-class "$cls" --single-class-output "holder/out/$n.java" "$APK" >/dev/null 2>&1; then
              cat "holder/out/$n.java" >> "$OUT"
            else
              echo DECOMPILE_FAILED >> "$OUT"
            fi
            echo >> "$OUT"
          done
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/profile-adfree-holder-1.163.5-rc1.txt
          git commit -m 'analysis: extract profile ad-free holder' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
