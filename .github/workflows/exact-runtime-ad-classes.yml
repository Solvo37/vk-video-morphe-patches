name: Extract exact runtime ad classes

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/exact-runtime-ad-classes.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf exact-runtime
          mkdir -p exact-runtime/out docs
          gh release download 1.163 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163-patched.apk' --dir exact-runtime
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o exact-runtime/jadx.zip
          unzip -q exact-runtime/jadx.zip -d exact-runtime/jadx
          chmod +x exact-runtime/jadx/bin/jadx
      - name: Decompile target classes
        run: |
          set -euo pipefail
          APK='exact-runtime/VK-Video-1.163-patched.apk'
          J='exact-runtime/jadx/bin/jadx'
          OUT='docs/exact-runtime-ad-classes-1.163.txt'
          : > "$OUT"
          classes=(
            'ee1.j'
            'xo.a'
            'no.z'
            'com.vk.api.generated.shortVideo.dto.ShortVideoRecomFeedItemDto$Deserializer'
            'com.vk.api.generated.shortVideo.dto.ShortVideoRecomFeedItemDto'
          )
          n=0
          for cls in "${classes[@]}"; do
            n=$((n+1))
            echo "===== $cls =====" >> "$OUT"
            if "$J" --no-res --show-bad-code --single-class "$cls" --single-class-output "exact-runtime/out/$n.java" "$APK" >/dev/null 2>&1; then
              cat "exact-runtime/out/$n.java" >> "$OUT"
            else
              echo DECOMPILE_FAILED >> "$OUT"
            fi
            echo >> "$OUT"
          done
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/exact-runtime-ad-classes-1.163.txt
          git commit -m 'analysis: extract exact runtime ad classes' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
