name: Extract ad-free promo classes

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/adfree-promo-classes.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download RC and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf adfreepromo
          mkdir -p adfreepromo/out docs
          gh release download 1.163.5-rc1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.5-rc1-patched.apk' --dir adfreepromo
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o adfreepromo/jadx.zip
          unzip -q adfreepromo/jadx.zip -d adfreepromo/jadx
          chmod +x adfreepromo/jadx/bin/jadx
      - name: Decompile candidate classes
        run: |
          set -euo pipefail
          APK='adfreepromo/VK-Video-1.163.5-rc1-patched.apk'
          J='adfreepromo/jadx/bin/jadx'
          OUT='docs/adfree-promo-classes-1.163.5-rc1.txt'
          : > "$OUT"
          classes=(
            'com.vk.video.ui.discovery.minimizable.adfree.VideoAdFreeButton'
            'com.vk.libvideo.adfree.impl.di.VideoAdFreeSubscriptionComponentImpl'
            'com.vk.libvideo.adfree.impl.ui.VideoAdFreeSubscriptionFragment'
            'com.vk.libvideo.adfree.impl.domain.i'
            'com.vk.libvideo.adfree.impl.domain.k'
            'com.vk.libvideo.adfree.impl.domain.c'
            'com.vk.libvideo.adfree.impl.domain.g'
          )
          n=0
          for cls in "${classes[@]}"; do
            n=$((n+1))
            echo "===== $cls =====" >> "$OUT"
            if "$J" --no-res --show-bad-code --single-class "$cls" --single-class-output "adfreepromo/out/$n.java" "$APK" >/dev/null 2>&1; then
              cat "adfreepromo/out/$n.java" >> "$OUT"
            else
              echo DECOMPILE_FAILED >> "$OUT"
            fi
            echo >> "$OUT"
          done
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/adfree-promo-classes-1.163.5-rc1.txt
          git commit -m 'analysis: extract ad-free promo classes' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
