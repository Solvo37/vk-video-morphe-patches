name: Inspect catalog ad configuration

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/catalog-ad-config.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download APK and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf catcfg
          mkdir -p catcfg/out docs
          gh release download 1.163.3 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.3-patched.apk' --dir catcfg
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o catcfg/jadx.zip
          unzip -q catcfg/jadx.zip -d catcfg/jadx
          chmod +x catcfg/jadx/bin/jadx
      - name: Decompile configuration
        run: |
          set -euo pipefail
          J='catcfg/jadx/bin/jadx'
          APK='catcfg/VK-Video-1.163.3-patched.apk'
          OUT='docs/catalog-ad-config-1.163.3.txt'
          : > "$OUT"
          for cls in             'com.vk.catalog2.common.ui.mvp.configuration.a'             'com.vk.catalog2.common.dto.ui.UiBlockAdBanner'; do
            echo "===== $cls =====" >> "$OUT"
            n="$(wc -l < "$OUT")"
            "$J" --no-res --show-bad-code --single-class "$cls" --single-class-output "catcfg/out/$n.java" "$APK" >/dev/null 2>&1 || true
            cat "catcfg/out/$n.java" >> "$OUT" 2>/dev/null || true
            echo >> "$OUT"
          done
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/catalog-ad-config-1.163.3.txt
          git commit -m 'analysis: inspect catalog ad configuration' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
