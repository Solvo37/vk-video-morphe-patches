name: Diagnose delta APK signing

on:
  push:
    branches: [ad-analysis-1.163]
    paths:
      - '.github/workflows/diagnose-delta-sign.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq unzip zip

      - name: Download stable base and patch bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download 1.163 --repo "$GITHUB_REPOSITORY" \
            --pattern 'VK-Video-1.163-patched.apk' --dir work
          gh release download patches-v0.2.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'vk-video-morphe-patches-0.2.1.mpp' --dir work
          curl -fL --retry 4 -o work/morphe.jar \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          echo "82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  work/morphe.jar" | sha256sum -c -

      - name: Apply delta ad patches
        run: |
          set -euo pipefail
          java -jar work/morphe.jar patch \
            -p work/vk-video-morphe-patches-0.2.1.mpp \
            --force --exclusive \
            -e "Remove video ads" \
            -e "Remove clip ads" \
            --bytecode-mode STRIP_FAST \
            --unsigned \
            -r work/delta-result.json \
            -o work/delta-unsigned.apk \
            work/VK-Video-1.163-patched.apk
          cat work/delta-result.json
          jq -e 'all(.patchingSteps[]?; .success == true) and ((.failedPatches // []) | length == 0) and (any(.appliedPatches[]?; .name == "Remove video ads")) and (any(.appliedPatches[]?; .name == "Remove clip ads"))' work/delta-result.json >/dev/null

      - name: Sign with temporary key and diagnose
        run: |
          set -u
          keytool -genkeypair -noprompt \
            -keystore work/test.jks -storepass testpass -keypass testpass \
            -alias test -keyalg RSA -keysize 2048 -validity 1000 \
            -dname "CN=Delta Test,O=Test,C=US"

          set +e
          echo "== unsigned archive test =="
          unzip -t work/delta-unsigned.apk >/tmp/unzip-test.log 2>&1
          UNZIP_RC=$?
          tail -n 10 /tmp/unzip-test.log
          echo "unzip rc=$UNZIP_RC"

          echo "== unsigned alignment check =="
          zipalign -c -v -p 4 work/delta-unsigned.apk >/tmp/align-check.log 2>&1
          CHECK_RC=$?
          tail -n 20 /tmp/align-check.log
          echo "unsigned alignment rc=$CHECK_RC"

          if [[ "$CHECK_RC" -eq 0 ]]; then
            cp work/delta-unsigned.apk work/delta-aligned.apk
            ALIGN_RC=0
          else
            echo "== realign =="
            zipalign -f -v -p 4 work/delta-unsigned.apk work/delta-aligned.apk >/tmp/realign.log 2>&1
            ALIGN_RC=$?
            tail -n 30 /tmp/realign.log
            echo "realign rc=$ALIGN_RC"
          fi

          echo "== sign =="
          apksigner sign \
            --ks work/test.jks --ks-pass pass:testpass \
            --ks-key-alias test --key-pass pass:testpass \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out work/delta-test-signed.apk \
            work/delta-aligned.apk
          SIGN_RC=$?
          echo "sign rc=$SIGN_RC"

          echo "== verify =="
          VERIFY="$(apksigner verify --verbose --print-certs work/delta-test-signed.apk 2>&1)"
          VERIFY_RC=$?
          printf '%s\n' "$VERIFY"
          echo "verify rc=$VERIFY_RC"

          echo "== signed alignment =="
          zipalign -c -v -p 4 work/delta-test-signed.apk >/tmp/signed-align.log 2>&1
          SIGNED_ALIGN_RC=$?
          tail -n 20 /tmp/signed-align.log
          echo "signed alignment rc=$SIGNED_ALIGN_RC"

          echo "== badging =="
          aapt dump badging work/delta-test-signed.apk | head -n 5
          BADGING_RC=$?
          echo "badging rc=$BADGING_RC"

          if [[ "$UNZIP_RC" -ne 0 || "$ALIGN_RC" -ne 0 || "$SIGN_RC" -ne 0 || "$VERIFY_RC" -ne 0 || "$SIGNED_ALIGN_RC" -ne 0 || "$BADGING_RC" -ne 0 ]]; then
            exit 1
          fi
