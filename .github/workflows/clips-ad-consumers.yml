name: Map VK Clips ad consumers

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/clips-ad-consumers.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf consumers
          mkdir -p consumers/dex docs
          gh release download 1.163 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163-patched.apk' --dir consumers
          cd consumers/dex
          unzip -q ../VK-Video-1.163-patched.apk 'classes*.dex'

      - name: Map exact consumers
        run: |
          set -euo pipefail
          DEXDUMP="$(find "$ANDROID_SDK_ROOT/build-tools" -type f \( -name dexdump -o -name dexdump.exe \) | sort -V | tail -n1)"
          export DEXDUMP
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path

          needles = [
            'ShortVideoFeedItemShortVideoMytargetSdkAdDto',
            'ShortVideoFeedItemShortVideoMytargetSdkStaticDto',
            'ShortVideoFeedItemShortVideoMytargetSdkCarouselDto',
            'ShortVideoFeedItemShortVideoMytargetSdkVideoDto',
            'ShortVideoFeedItemShortVideoMytargetSdkPromoDto',
            'ShortVideoFeedItemShortVideoMarketAdDto',
            'ShortVideoFeedItemShortVideoStaticAdDto',
            'ShortVideoFeedItemShortVideoFloatingAdDto',
            'Lcom/vk/clips/sdk/shared/item/ads/',
            'SdkAdsChoices',
            'MyTargetAdsDataProvider',
            'AD_CLIP_SHOW',
            'AD_CLIP_CLICK',
          ]
          desc_re=re.compile(r"Class descriptor\s*:\s*'([^']+)'")
          meth_re=re.compile(r"\]\s+([^\s]+\.[^:]+):")
          results=[]
          dexdump=os.environ['DEXDUMP']

          for dex in sorted(Path('consumers/dex').glob('classes*.dex')):
            p=subprocess.Popen([dexdump,'-d',str(dex)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                               text=True,encoding='utf-8',errors='replace')
            current_class=''
            current_method=''
            ring=[]
            for line in p.stdout:
              dm=desc_re.search(line)
              if dm: current_class=dm.group(1)
              mm=meth_re.search(line)
              if mm: current_method=mm.group(1)
              if any(n in line for n in needles):
                results.append((dex.name,current_class,current_method,line.strip(),''.join(ring[-8:])))
              ring.append(line)
              if len(ring)>16: ring.pop(0)
            p.wait()
            if p.returncode: raise SystemExit(p.returncode)

          out=Path('docs/clips-ad-consumers-1.163.txt')
          seen=set()
          with out.open('w',encoding='utf-8') as f:
            for dex,cls,meth,line,ctx in results:
              key=(dex,cls,meth,line)
              if key in seen: continue
              seen.add(key)
              f.write(f'===== {dex} :: {cls} :: {meth} =====\n')
              f.write(ctx)
              f.write('MATCH: '+line+'\n\n')
          print(len(seen), out.stat().st_size)
          PY

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/clips-ad-consumers-1.163.txt
          git commit -m 'analysis: map VK Clips ad consumers' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
