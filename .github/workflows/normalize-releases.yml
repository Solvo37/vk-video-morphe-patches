name: Normalize releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-releases.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the verified APK as 1.163.6
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SOURCE_TAG='1.163.3'
          SOURCE_ASSET='VK-Video-1.163.3-patched.apk'
          TARGET_TAG='1.163.6'
          TARGET_ASSET='VK-Video-1.163.6-patched.apk'
          EXPECTED_SHA256='404af6d2ddad48cf3e6531223db1c8bc7ae4f36640c6b7dafaebf90269728f54'

          mkdir -p dist
          gh release download "$SOURCE_TAG" --repo "$REPO" --pattern "$SOURCE_ASSET" --dir dist
          echo "$EXPECTED_SHA256  dist/$SOURCE_ASSET" | sha256sum -c -
          mv "dist/$SOURCE_ASSET" "dist/$TARGET_ASSET"

          mapfile -t TAGS < <(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName')
          for tag in "${TAGS[@]}"; do
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
          done

          cat > release-notes.md <<'EOF'
          ## VK Video 1.163.6

          Чистый стабильный релиз.

          - Android version: **1.163**
          - versionCode: **51920**
          - ARM64
          - тот же проверенный APK, который был стабильным релизом 1.163.3
          - SHA-256: `404af6d2ddad48cf3e6531223db1c8bc7ae4f36640c6b7dafaebf90269728f54`
          - совместная установка с обычным VK

          В Release намеренно оставлен только APK.
          EOF

          gh release create "$TARGET_TAG" "dist/$TARGET_ASSET#VK Video patched APK" \
            --repo "$REPO" \
            --title 'VK Video 1.163.6 — patched APK' \
            --notes-file release-notes.md \
            --latest

          test "$(gh release list --repo "$REPO" --limit 100 --json tagName --jq 'length')" = '1'
          test "$(gh api "repos/$REPO/releases/tags/$TARGET_TAG" --jq '.assets | length')" = '1'
          test "$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')" = "$TARGET_TAG"
