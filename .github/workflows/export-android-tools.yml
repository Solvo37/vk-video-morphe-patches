name: Export Android signing tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-android-tools.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android build tools
        id: tools
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -f "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          mkdir -p out
          cp "$BT/lib/apksigner.jar" out/
          cp "$BT/zipalign" out/
          echo "Using $BT"

      - name: Upload tools
        uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools
          path: out/
          retention-days: 1
