name: Summarize VK Video ad dex scan

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/ad-summarize.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
          fetch-depth: 1

      - name: Build compact keypoints
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from collections import defaultdict
          from pathlib import Path

          src = Path('docs/ad-fast-scan-1.163.txt')
          out = Path('docs/ad-keypoints-1.163.txt')

          target = re.compile(r'my[./ _-]?target|instream|pre[_ -]?roll|mid[_ -]?roll|post[_ -]?roll|vast|vmap|ad[_ -]?break|ad[_ -]?tag|clip.{0,40}ad|ad.{0,40}clip', re.I)
          class_re = re.compile(r"Class descriptor\s*:\s*'([^']+)'")
          name_re = re.compile(r"^\s*name\s*:\s*'([^']+)'")
          dex_re = re.compile(r'^=====\s+(.*?)\s+:')

          dex = ''
          cls = ''
          name = ''
          buckets = defaultdict(set)

          for raw in src.open('r', encoding='utf-8', errors='replace'):
              line = raw.rstrip('\n')
              dm = dex_re.search(line)
              if dm:
                  dex = dm.group(1)
                  cls = ''
                  name = ''
              cm = class_re.search(line)
              if cm:
                  cls = cm.group(1)
                  name = ''
              nm = name_re.search(line)
              if nm:
                  name = nm.group(1)
              if cls and target.search(line):
                  buckets[(dex, cls, name)].add(line.strip()[:380])

          def score(item):
              (dex, cls, name), hits = item
              txt = ' '.join(hits).lower()
              p = 0
              if cls.startswith(('Lcom/vk/', 'Lcom/vkontakte/')): p -= 500
              if cls.startswith('Lcom/my/target/'): p -= 400
              if 'my' in txt and 'target' in txt: p -= 150
              if 'instream' in txt: p -= 120
              if 'preroll' in txt or 'pre_roll' in txt or 'pre-roll' in txt: p -= 100
              if 'midroll' in txt or 'mid_roll' in txt or 'mid-roll' in txt: p -= 95
              if 'vast' in txt or 'vmap' in txt: p -= 70
              if 'clip' in txt and 'ad' in txt: p -= 60
              return (p, cls, name)

          ordered = sorted(buckets.items(), key=score)
          app = [x for x in ordered if x[0][1].startswith(('Lcom/vk/', 'Lcom/vkontakte/'))][:100]
          sdk = [x for x in ordered if x[0][1].startswith('Lcom/my/target/')][:70]
          other = [x for x in ordered if x not in app and x not in sdk][:70]

          with out.open('w', encoding='utf-8') as f:
              f.write('# VK Video 1.163 ad keypoints\n')
              f.write(f'Total buckets: {len(ordered)}\n\n')
              for title, group in [('VK APP CALLERS', app), ('MYTARGET SDK', sdk), ('OTHER AD PATHS', other)]:
                  f.write(f'## {title}\n')
                  for (dex, cls, name), hits in group:
                      f.write(f'{cls} :: {name or "<unknown>"} [{dex}]\n')
                      for h in sorted(hits)[:4]:
                          f.write(f'  {h}\n')
                  f.write('\n')

          print(out.stat().st_size)
          PY

      - name: Commit keypoints
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ad-keypoints-1.163.txt
          git commit -m 'analysis: extract VK Video 1.163 ad keypoints' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
