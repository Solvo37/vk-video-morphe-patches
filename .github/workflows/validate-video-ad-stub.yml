name: Validate home and player ad blockers
# clean-source validation v2

on:
  push:
    branches:
      - fix/home-and-player-ads-1.163.4
    paths:
      - '.github/workflows/validate-video-ad-stub.yml'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'
      - name: Build bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon
      - name: Download base and Morphe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 1.163.3 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.3-patched.apk'
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          cp "$MPP" work.mpp
          MORPHE_VERSION='v1.16.0'
          curl -fL --retry 4 -o morphe.jar "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  morphe.jar" | sha256sum -c -
      - name: Apply home and player ad delta
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -jar morphe.jar patch \
            -i VK-Video-1.163.3-patched.apk \
            -p work.mpp \
            -e "Disable video ad repository" \
            -e "Hide home showcase ads" \
            -o out.apk \
            --report patch-result.json \
            --purge
          cat patch-result.json
          jq -e '
            all(.patchingSteps[]?; .success == true)
            and ((.failedPatches // []) | length == 0)
            and any(.appliedPatches[]?; .name == "Disable video ad repository")
            and any(.appliedPatches[]?; .name == "Hide home showcase ads")
          ' patch-result.json >/dev/null
          unzip -t out.apk >/dev/null
