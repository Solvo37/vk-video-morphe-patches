name: Roll back broken 1.163.4 latest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-1.163.4-latest.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Mark 1.163.4 broken and restore 1.163.3 latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          R4_ID="$(gh api "repos/$REPO/releases/tags/1.163.4" --jq '.id')"
          R3_ID="$(gh api "repos/$REPO/releases/tags/1.163.3" --jq '.id')"

          gh api --method PATCH "repos/$REPO/releases/$R4_ID"             -f prerelease=true             -f make_latest=false             -f name='VK Video 1.163 (51920) patched — BROKEN, do not install'             -f body='Known issue: 1.163.4 crashes on application startup. Use 1.163.3 while the regression is being isolated.'

          gh api --method PATCH "repos/$REPO/releases/$R3_ID"             -f make_latest=true

          echo "latest=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          test "$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')" = "1.163.3"
