name: Inspect VK Clips ad item

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/clips-ad-item.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf clipsitem
          mkdir -p clipsitem/out docs
          gh release download 1.163 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163-patched.apk' --dir clipsitem
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o clipsitem/jadx.zip
          unzip -q clipsitem/jadx.zip -d clipsitem/jadx
          chmod +x clipsitem/jadx/bin/jadx
      - name: Decompile clips ad item classes
        run: |
          set -euo pipefail
          APK='clipsitem/VK-Video-1.163-patched.apk'
          J='clipsitem/jadx/bin/jadx'
          OUT='docs/clips-ad-item-1.163.txt'
          : > "$OUT"
          classes=(
            'com.vk.clips.sdk.shared.item.ads.c'
            'com.vk.clips.sdk.shared.item.ads.a'
            'com.vk.clips.sdk.shared.item.ads.b'
            'com.vk.clips.sdk.shared.item.ads.d'
            'com.vk.clips.sdk.shared.feed.model.FeedItem$d'
          )
          n=0
          for cls in "${classes[@]}"; do
            n=$((n+1))
            echo "===== $cls =====" >> "$OUT"
            if "$J" --no-res --single-class "$cls" --single-class-output "clipsitem/out/$n.java" "$APK" >/dev/null 2>&1; then
              cat "clipsitem/out/$n.java" >> "$OUT"
            else
              echo DECOMPILE_FAILED >> "$OUT"
            fi
            echo >> "$OUT"
          done
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/clips-ad-item-1.163.txt
          git commit -m 'analysis: inspect VK Clips ad feed item' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
