name: Finalize 0.2 baseline release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-0.2-baseline.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Android tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq

      - name: Download current stable APK and current patch bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify bundle

          gh release download 1.163             --repo "$GITHUB_REPOSITORY"             --pattern 'VK-Video-1.163-patched.apk'             --dir verify

          gh release download patches-v0.2.0             --repo "$GITHUB_REPOSITORY"             --pattern 'vk-video-morphe-patches-0.2.0.mpp'             --dir bundle

      - name: Verify exact stable APK
        run: |
          set -euo pipefail
          APK=verify/VK-Video-1.163-patched.apk

          zipalign -c -p 4 "$APK"
          apksigner verify --verbose --print-certs "$APK"

          CERT="$(apksigner verify --print-certs "$APK"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == 'd41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a' ]]

          BADGING="$(aapt dump badging "$APK" | head -n1)"
          grep -q "name='com.vk.vkvideo'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"

          aapt dump xmltree "$APK" AndroidManifest.xml > verify/manifest.txt
          python ci/verify_manifest.py verify/manifest.txt
          python ci/verify_patched_apk.py "$APK" --json-out verify/release-verification.json

      - name: Generate baseline provenance
        run: |
          set -euo pipefail
          APK=verify/VK-Video-1.163-patched.apk
          FINAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          FINAL_SIZE="$(stat -c '%s' "$APK")"
          MPP_SHA="$(sha256sum bundle/vk-video-morphe-patches-0.2.0.mpp | awk '{print $1}')"

          jq -n             --arg source "manually-verified-baseline"             --arg package "com.vk.vkvideo"             --arg version_name "1.163"             --argjson version_code 51920             --arg certificate_sha256 "057d974412032066f1b5edb1fdb550f71854189815c806b27c4d486fb4f1ef32"             --arg base_apk_sha256 "61d8c2b0837704d2d197a35b75f5c07872927e77d8861b61ce78ba0c5626c1c8"             --argjson size_bytes 152005937             '{
              selected: {
                source: $source,
                package: $package,
                version_name: $version_name,
                version_code: $version_code,
                certificate_sha256: $certificate_sha256,
                base_apk_sha256: $base_apk_sha256,
                size_bytes: $size_bytes
              },
              candidates: []
            }' > verify/upstream.json

          jq -n             --arg package "com.vk.vkvideo"             --arg version_name "1.163"             --argjson version_code 51920             --arg final_apk_sha256 "$FINAL_SHA"             --argjson final_apk_size "$FINAL_SIZE"             --arg patch_bundle_version "0.2.0"             --arg patch_bundle_sha256 "$MPP_SHA"             --arg project_certificate_sha256 "d41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a"             '{
              package: $package,
              version_name: $version_name,
              version_code: $version_code,
              patch_profile: "full",
              patch_bundle_version: $patch_bundle_version,
              patch_bundle_sha256: $patch_bundle_sha256,
              bytecode_mode: "STRIP_FAST",
              native_target: "arm64-v8a/libvkcore.so",
              signing: {
                scheme_v1: false,
                scheme_v2: false,
                scheme_v3: true,
                scheme_v4: false,
                certificate_sha256: $project_certificate_sha256
              },
              final_apk: {
                sha256: $final_apk_sha256,
                size_bytes: $final_apk_size
              },
              verification: {
                patch_profile_real_device_launch_verified: true,
                exact_release_static_gates_verified: true,
                exact_release_real_device_launch_verified: false
              }
            }' > verify/build-metadata.json

          sha256sum "$APK" > verify/VK-Video-1.163-patched.sha256

      - name: Refresh stable release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Remove the superseded patch bundle from the app release.
          gh release delete-asset 1.163             vk-video-morphe-patches-0.1.2.mpp             --repo "$GITHUB_REPOSITORY"             --yes 2>/dev/null || true

          # Make sure only the current bundle is attached to the installable release.
          gh release upload 1.163             bundle/vk-video-morphe-patches-0.2.0.mpp             verify/VK-Video-1.163-patched.sha256             verify/upstream.json             verify/build-metadata.json             verify/release-verification.json             --clobber             --repo "$GITHUB_REPOSITORY"

          cat > verify/release-notes.md <<'EOF'
          ## VK Video 1.163 patched

          Стабильная ARM64-сборка текущего patch profile.

          ### Что включено

          - совместная установка с обычным VK (`com.vkontakte.android`);
          - native `libvkcore.so` signature-check bypass;
          - отключение встроенного update prompt;
          - отключение client-side instream / overlay / motion video ads;
          - скрытие promoted banner в Discover;
          - отключение отдельного ad pixel tracker.

          ### Проверка

          Полный профиль патчей проверен запуском на реальном ARM64 Android-устройстве. Точный APK asset этого Release дополнительно проходит автоматические 0.2 static gates: package/version, project certificate, zipalign, отсутствие v1/JAR signature, manifest coexistence, реальный DEX class definition `VkVideoApplication` и native binary pattern.

          ### Сборка

          - VK Video: **1.163 / 51920**
          - patch bundle: **0.2.0**
          - Morphe: **STRIP_FAST**
          - ABI: **ARM64 / arm64-v8a**
          - APK signing: **v3 only**

          Перед первой установкой удалите только официальный **VK Видео**. Обычный **VK** удалять не нужно.

          `upstream.json`, `build-metadata.json` и `release-verification.json` содержат machine-readable provenance и результаты проверки.
          EOF

          gh release edit 1.163             --repo "$GITHUB_REPOSITORY"             --title "VK Video 1.163 (51920) patched"             --notes-file verify/release-notes.md             --latest

      - name: Update repository public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --method PATCH "repos/$GITHUB_REPOSITORY"             -f description='Патчи Morphe и подписанные APK для VK Видео Android: без видеорекламы, без встроенных обновлений, совместимо с обычным VK, обновления через Obtainium.'

          printf '%s\n'             '{"names":["android","vk-video","morphe","obtainium","patches"]}'             | gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" --input -

      - name: Upload baseline verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-1.163-0.2-verification
          path: |
            verify/manifest.txt
            verify/upstream.json
            verify/build-metadata.json
            verify/release-verification.json
            verify/VK-Video-1.163-patched.sha256
          retention-days: 7
