name: Fast trace home showcase ad

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/home-showcase-fast.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download APK and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf fastshow
          mkdir -p fastshow/dex fastshow/out docs
          gh release download 1.163.3 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.3-patched.apk' --dir fastshow
          cd fastshow/dex
          unzip -q ../VK-Video-1.163.3-patched.apk 'classes*.dex'
          cd ../..
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o fastshow/jadx.zip
          unzip -q fastshow/jadx.zip -d fastshow/jadx
          chmod +x fastshow/jadx/bin/jadx
      - name: Decompile exact holder
        run: |
          set -euo pipefail
          OUT='docs/home-showcase-fast-1.163.3.txt'
          : > "$OUT"
          J='fastshow/jadx/bin/jadx'
          APK='fastshow/VK-Video-1.163.3-patched.apk'
          echo '===== AdShowCaseBannerVh =====' >> "$OUT"
          "$J" --no-res --show-bad-code --single-class 'com.vk.catalog2.common.ui.holders.ads.AdShowCaseBannerVh' --single-class-output fastshow/out/holder.java "$APK" >/dev/null 2>&1 || true
          cat fastshow/out/holder.java >> "$OUT" 2>/dev/null || true
          echo >> "$OUT"
      - name: Find DEX xrefs
        run: |
          set -euo pipefail
          DEXDUMP="$(find "$ANDROID_SDK_ROOT/build-tools" -type f \( -name dexdump -o -name dexdump.exe \) | sort -V | tail -n1)"
          OUT='docs/home-showcase-fast-1.163.3.txt'
          for dex in fastshow/dex/classes*.dex; do
            "$DEXDUMP" -d "$dex" 2>/dev/null | grep -E -B 80 -A 140 'AdShowCaseBannerVh|nativeads_age_restrictions|nativeads_ad_marker|nativeads_' | head -n 30000 >> "$OUT" || true
          done
          wc -c "$OUT"
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/home-showcase-fast-1.163.3.txt
          git commit -m 'analysis: fast trace home showcase ad' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
