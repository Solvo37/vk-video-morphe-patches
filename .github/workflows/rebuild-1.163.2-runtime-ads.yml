name: Rebuild VK Video 1.163.2 runtime ad removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-1.163.2-runtime-ads.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: rebuild-vk-video-1.163.2-runtime-ads
  cancel-in-progress: false

env:
  PROJECT_CERT_SHA256: d41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a
  BASE_APK_SHA256: 2b31673da4de0cfbeb3ba894749043adc204d1435ac58bb006e678488e06da23
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c
  RELEASE_TAG: 1.163.2

jobs:
  rebuild:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Install Android verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq unzip zip

      - name: Refuse to replace an existing revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace immutable assets."
            exit 1
          fi

      - name: Build Morphe patch bundle 0.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          [[ "$VERSION" == "0.2.2" ]]
          gradle :patches:buildAndroid --no-daemon
          mkdir -p work dist
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          cp "$MPP" work/vk-video-morphe-patches-0.2.2.mpp

      - name: Download and verify stable 1.163.1 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 1.163.1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.1-patched.apk' --dir work
          echo "$BASE_APK_SHA256  work/VK-Video-1.163.1-patched.apk" | sha256sum -c -

          VERIFY="$(apksigner verify --verbose --print-certs work/VK-Video-1.163.1-patched.apk)"
          printf '%s\n' "$VERIFY"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "$PROJECT_CERT_SHA256" ]]
          grep -q 'Verified using v1 scheme (JAR signing): false' <<< "$VERIFY"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' <<< "$VERIFY"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$VERIFY"

          BADGING="$(aapt dump badging work/VK-Video-1.163.1-patched.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='com.vk.vkvideo'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"

      - name: Download pinned Morphe
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o work/morphe.jar "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "$MORPHE_SHA256  work/morphe.jar" | sha256sum -c -

      - name: Apply runtime ad-removal delta
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -jar work/morphe.jar patch \
            -p work/vk-video-morphe-patches-0.2.2.mpp \
            --force --exclusive \
            -e "Filter clip feed ads" \
            -e "Block midroll ads" \
            --bytecode-mode STRIP_FAST \
            --unsigned \
            -r dist/patch-result.json \
            -o dist/runtime-ads-unsigned.apk \
            work/VK-Video-1.163.1-patched.apk

          cat dist/patch-result.json
          jq -e '
            ((.patchingSteps // []) | length) > 0
            and all(.patchingSteps[]?; .success == true)
            and ((.failedPatches // []) | length == 0)
            and any(.appliedPatches[]?; .name == "Filter clip feed ads")
            and any(.appliedPatches[]?; .name == "Block midroll ads")
          ' dist/patch-result.json >/dev/null

      - name: Static gate before signing
        run: |
          set -euo pipefail
          zipalign -c -p 4 dist/runtime-ads-unsigned.apk
          unzip -t dist/runtime-ads-unsigned.apk >/dev/null

          aapt dump xmltree dist/runtime-ads-unsigned.apk AndroidManifest.xml > dist/manifest-xmltree.txt
          python ci/verify_manifest.py dist/manifest-xmltree.txt
          python ci/verify_patched_apk.py dist/runtime-ads-unsigned.apk --json-out dist/static-gate.json

      - name: Decode project signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > work/signing.jks
          test -s work/signing.jks

      - name: Sign and verify revision APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          apksigner sign \
            --ks work/signing.jks \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist/VK-Video-1.163.2-patched.apk \
            dist/runtime-ads-unsigned.apk

          VERIFY="$(apksigner verify --verbose --print-certs dist/VK-Video-1.163.2-patched.apk)"
          printf '%s\n' "$VERIFY"
          grep -q 'Verified using v1 scheme (JAR signing): false' <<< "$VERIFY"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' <<< "$VERIFY"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$VERIFY"

          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "$PROJECT_CERT_SHA256" ]]

          zipalign -c -p 4 dist/VK-Video-1.163.2-patched.apk

          BADGING="$(aapt dump badging dist/VK-Video-1.163.2-patched.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='com.vk.vkvideo'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"

          python ci/verify_patched_apk.py dist/VK-Video-1.163.2-patched.apk --json-out dist/final-gate.json
          sha256sum dist/VK-Video-1.163.2-patched.apk | tee dist/VK-Video-1.163.2-patched.sha256

      - name: Build release metadata
        run: |
          set -euo pipefail
          FINAL_SHA="$(cut -d' ' -f1 dist/VK-Video-1.163.2-patched.sha256)"
          jq -n \
            --arg package "com.vk.vkvideo" \
            --arg version_name "1.163" \
            --argjson version_code 51920 \
            --arg release_tag "$RELEASE_TAG" \
            --arg base_release_tag "1.163.1" \
            --arg base_apk_sha256 "$BASE_APK_SHA256" \
            --arg final_apk_sha256 "$FINAL_SHA" \
            --arg patch_bundle_version "0.2.2" \
            --arg project_cert "$PROJECT_CERT_SHA256" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              package: $package,
              version_name: $version_name,
              version_code: $version_code,
              release_tag: $release_tag,
              rebuild_type: "runtime ad-removal delta over verified project-signed 1.163.1",
              base_release_tag: $base_release_tag,
              base_apk_sha256: $base_apk_sha256,
              final_apk_sha256: $final_apk_sha256,
              patch_bundle_version: $patch_bundle_version,
              applied_delta_patches: ["Filter clip feed ads", "Block midroll ads"],
              bytecode_mode: "STRIP_FAST",
              signing: {
                scheme_v1: false,
                scheme_v2: false,
                scheme_v3: true,
                scheme_v4: false,
                certificate_sha256: $project_cert
              },
              workflow_run: $workflow_run
            }' > dist/delta-build-metadata.json

      - name: Publish immutable 1.163.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<'EOF'
          ## VK Video 1.163 (51920) — runtime ad removal revision 2

          This revision is built over the verified project-signed 1.163.1 APK and targets the two remaining ad paths reproduced after that release.

          New in this revision:
          - filters server-provided VK Clips StaticAd, MarketAd, FloatingAd and MyTarget feed items before ClipsRecomResponseAdapter can render them;
          - therefore blocks app-install / action CTA cards produced from appPackageName and appDeeplink;
          - blocks the runtime MIDROLL gate before VideoAutoPlay pauses or switches the main video player into InstreamAdEngine.

          Existing 1.163.1 ad hardening and compatibility patches remain in place.

          Verification:
          - both new Morphe delta patches applied with no failed patches;
          - manifest coexistence gate passed;
          - ARM64 native signature bypass pattern passed;
          - DEX application-class gate passed;
          - package remains com.vk.vkvideo, Android version remains 1.163 / 51920;
          - APK is zip-aligned and signed with the same project certificate using APK Signature Scheme v3 only.

          Build provenance is included in delta-build-metadata.json.
          EOF

          gh release create "$RELEASE_TAG" \
            dist/VK-Video-1.163.2-patched.apk \
            dist/VK-Video-1.163.2-patched.sha256 \
            work/vk-video-morphe-patches-0.2.2.mpp \
            dist/patch-result.json \
            dist/static-gate.json \
            dist/final-gate.json \
            dist/delta-build-metadata.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VK Video 1.163 (51920) patched — runtime ad removal r2" \
            --notes-file dist/release-notes.md \
            --latest
