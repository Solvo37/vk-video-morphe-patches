name: Validate runtime ad blockers 1.163.2

on:
  push:
    branches: [fix/runtime-ad-removal-1.163.2]
    paths:
      - 'patches/**'
      - 'gradle.properties'
      - 'patches-list.json'
      - 'ci/**'
      - '.github/workflows/validate-runtime-ads-1.163.2.yml'

permissions:
  contents: read
  packages: read

env:
  PROJECT_CERT_SHA256: d41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Install Android verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq unzip zip

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Download base and Morphe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work dist
          gh release download 1.163.1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.1-patched.apk' --dir work
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          cp "$MPP" work/runtime-ads-0.2.2.mpp
          curl -fL --retry 4 -o work/morphe.jar "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "$MORPHE_SHA256  work/morphe.jar" | sha256sum -c -

      - name: Apply only new runtime ad patches
        run: |
          set -euo pipefail
          java -jar work/morphe.jar patch \
            -p work/runtime-ads-0.2.2.mpp \
            --force --exclusive \
            -e "Filter clip feed ads" \
            -e "Block midroll ads" \
            --bytecode-mode STRIP_FAST \
            --unsigned \
            -r dist/patch-result.json \
            -o dist/runtime-ads-unsigned.apk \
            work/VK-Video-1.163.1-patched.apk

          cat dist/patch-result.json
          jq -e '
            ((.patchingSteps // []) | length) > 0
            and all(.patchingSteps[]?; .success == true)
            and ((.failedPatches // []) | length == 0)
            and any(.appliedPatches[]?; .name == "Filter clip feed ads")
            and any(.appliedPatches[]?; .name == "Block midroll ads")
          ' dist/patch-result.json >/dev/null

      - name: Static APK gates
        run: |
          set -euo pipefail
          zipalign -c -p 4 dist/runtime-ads-unsigned.apk
          unzip -t dist/runtime-ads-unsigned.apk >/dev/null
          aapt dump xmltree dist/runtime-ads-unsigned.apk AndroidManifest.xml > dist/manifest-xmltree.txt
          python ci/verify_manifest.py dist/manifest-xmltree.txt
          python ci/verify_patched_apk.py dist/runtime-ads-unsigned.apk --json-out dist/static-gate.json

      - name: Decode project signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > work/signing.jks
          test -s work/signing.jks

      - name: Sign and verify test APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner sign \
            --ks work/signing.jks \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist/VK-Video-1.163.2-TEST.apk \
            dist/runtime-ads-unsigned.apk

          VERIFY="$(apksigner verify --verbose --print-certs dist/VK-Video-1.163.2-TEST.apk)"
          printf '%s\n' "$VERIFY"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "$PROJECT_CERT_SHA256" ]]
          grep -q 'Verified using v1 scheme (JAR signing): false' <<< "$VERIFY"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' <<< "$VERIFY"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$VERIFY"
          zipalign -c -p 4 dist/VK-Video-1.163.2-TEST.apk

          BADGING="$(aapt dump badging dist/VK-Video-1.163.2-TEST.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='com.vk.vkvideo'" <<< "$BADGING"
          grep -q "versionCode='51920'" <<< "$BADGING"
          grep -q "versionName='1.163'" <<< "$BADGING"
          python ci/verify_patched_apk.py dist/VK-Video-1.163.2-TEST.apk --json-out dist/final-gate.json
