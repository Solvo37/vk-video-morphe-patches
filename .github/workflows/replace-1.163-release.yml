name: Replace VK Video 1.163 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-1.163-release.yml'

permissions:
  contents: write

concurrency:
  group: replace-vk-video-1-163
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.vk.vkvideo
  EXPECTED_VERSION: '1.163'
  EXPECTED_VERSION_CODE: '51920'
  OLD_RELEASE_SHA256: 014063018ec150855dabfa2b3501c22f69ffec46952e761f0e58dfa1cb3e580e
  TARGET_MAP_SHA256: 013866d3bf7a2e21c408ef61ec1ff7c5c37d22304a45af1b2319d3e7d662ab4e
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  replace:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign unzip zip

      - name: Download current 1.163 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download 1.163             --repo "$GITHUB_REPOSITORY"             --pattern 'VK-Video-1.163-patched.apk'             --dir work
          mv work/VK-Video-1.163-patched.apk work/old-release.apk

          ACTUAL="$(sha256sum work/old-release.apk | awk '{print $1}')"
          echo "Current release SHA-256: $ACTUAL"
          [[ "$ACTUAL" == "$OLD_RELEASE_SHA256" ]]

          BADGING="$(aapt dump badging work/old-release.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='${PACKAGE_NAME}'" <<< "$BADGING"
          grep -q "versionName='${EXPECTED_VERSION}'" <<< "$BADGING"
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" <<< "$BADGING"

      - name: Restore tested STRIP_FAST DEX layout
        run: |
          set -euo pipefail

          cat tools/dex-map/part1.b64               tools/dex-map/part2.b64               tools/dex-map/part3.b64               tools/dex-map/part4.b64             | base64 -d | gzip -d > work/dex-targets.bin

          echo "${TARGET_MAP_SHA256}  work/dex-targets.bin" | sha256sum -c -

          curl -fL --retry 4             -o work/morphe.jar             "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "${MORPHE_SHA256}  work/morphe.jar" | sha256sum -c -

          mkdir -p work/tool-classes work/newdex
          javac -cp work/morphe.jar -d work/tool-classes tools/DexRepack.java

          "$JAVA_HOME/bin/java" -Xmx6g             -cp "work/morphe.jar:work/tool-classes"             DexRepack             work/old-release.apk             work/dex-targets.bin             work/newdex

          test "$(find work/newdex -maxdepth 1 -name 'classes*.dex' | wc -l)" -eq 13
          test ! -e work/newdex/classes14.dex

      - name: Apply proven native signature bypass
        run: |
          set -euo pipefail
          mkdir -p work/payload/lib/arm64-v8a

          cp work/newdex/classes*.dex work/payload/
          unzip -p work/old-release.apk lib/arm64-v8a/libvkcore.so             > work/payload/lib/arm64-v8a/libvkcore.so

          python - <<'PY'
          from pathlib import Path

          p = Path("work/payload/lib/arm64-v8a/libvkcore.so")
          data = bytearray(p.read_bytes())

          original = bytes.fromhex("1f1c0072e80700f900050054")
          patched  = bytes.fromhex("1f1c0072e80700f900040054")

          original_count = data.count(original)
          patched_count = data.count(patched)
          print("native original pattern:", original_count)
          print("native patched pattern:", patched_count)

          if original_count == 1 and patched_count == 0:
              pos = data.index(original)
              data[pos:pos + len(original)] = patched
              p.write_bytes(data)
          elif original_count == 0 and patched_count == 1:
              pass
          else:
              raise SystemExit("Unexpected libvkcore signature-check pattern count")
          PY

      - name: Build unsigned Variant 5 payload
        run: |
          set -euo pipefail
          cp work/old-release.apk work/variant5-unsigned.apk

          # Remove the FULL-repacked DEX set, its old JAR/v1 signature, and the unpatched native library.
          zip -q -d work/variant5-unsigned.apk 'classes*.dex' 'META-INF/*' 'lib/arm64-v8a/libvkcore.so' || true

          (
            cd work/payload
            zip -9 -q ../variant5-unsigned.apk classes*.dex lib/arm64-v8a/libvkcore.so
          )

          # The tested layout has exactly 13 dex files.
          COUNT="$(zipinfo -1 work/variant5-unsigned.apk | grep -Ec '^classes([0-9]+)?\.dex$')"
          echo "DEX count: $COUNT"
          test "$COUNT" -eq 13
          ! zipinfo -1 work/variant5-unsigned.apk | grep -q '^classes14\.dex$'
          ! zipinfo -1 work/variant5-unsigned.apk | grep -q '^META-INF/.*\.(RSA|SF)$'

      - name: Zipalign and v3-only sign
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > work/signing.jks
          test -s work/signing.jks

          zipalign -f -p 4 work/variant5-unsigned.apk work/variant5-aligned.apk

          apksigner sign             --ks work/signing.jks             --ks-pass env:STORE_PASSWORD             --ks-key-alias "$KEY_ALIAS"             --key-pass env:KEY_PASSWORD             --v1-signing-enabled false             --v2-signing-enabled false             --v3-signing-enabled true             --v4-signing-enabled false             --out work/VK-Video-1.163-patched.apk             work/variant5-aligned.apk

          zipalign -c -p 4 work/VK-Video-1.163-patched.apk

          VERIFY="$(apksigner verify --verbose --print-certs work/VK-Video-1.163-patched.apk)"
          echo "$VERIFY"
          grep -q 'Verified using v1 scheme (JAR signing): false' <<< "$VERIFY"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' <<< "$VERIFY"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$VERIFY"

          BADGING="$(aapt dump badging work/VK-Video-1.163-patched.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='${PACKAGE_NAME}'" <<< "$BADGING"
          grep -q "versionName='${EXPECTED_VERSION}'" <<< "$BADGING"
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" <<< "$BADGING"

          sha256sum work/VK-Video-1.163-patched.apk             | tee work/VK-Video-1.163-patched.sha256

      - name: Replace GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload 1.163             work/VK-Video-1.163-patched.apk             work/VK-Video-1.163-patched.sha256             --clobber             --repo "$GITHUB_REPOSITORY"

          gh release edit 1.163             --repo "$GITHUB_REPOSITORY"             --title "VK Video 1.163 patched"             --notes "Variant 5 build.

          VK Video: 1.163 (51920)
          Includes stock-VK coexistence fix, video ad removal, promoted-banner hiding, ad-pixel blocking, disabled in-app update, and the proven libvkcore native signature-check bypass.

          DEX layout restored to the tested STRIP_FAST layout, zipaligned, and signed v3-only with the project's persistent release key."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vk-video-1.163-release-replacement
          path: |
            work/VK-Video-1.163-patched.sha256
            work/dex-targets.bin
          if-no-files-found: warn
          retention-days: 3
