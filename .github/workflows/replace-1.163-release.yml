name: Replace VK Video 1.163 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-1.163-release.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: replace-vk-video-1-163
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.vk.vkvideo
  EXPECTED_VERSION: '1.163'
  EXPECTED_VERSION_CODE: '51921'
  EXPECTED_CERT_SHA256: 057d974412032066f1b5edb1fdb550f71854189815c806b27c4d486fb4f1ef32
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  replace:
    if: github.repository == 'Solvo37/vk-video-morphe-patches'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Install Android tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq unzip zip
          python -m pip install --disable-pip-version-check requests selectolax

      - name: Download official VK Video 1.163 from APKMirror
        run: |
          set -euo pipefail
          mkdir -p upstream

          python - <<'PY'
          from pathlib import Path
          import requests
          from selectolax.lexbor import LexborHTMLParser

          page = (
              "https://www.apkmirror.com/apk/vk-llc/vk-video-2/"
              "vk-video-movies-cartoons-tv-1-163-release/"
              "vk-video-movies-cartoons-tv-1-163-2-android-apk-download/"
          )

          s = requests.Session()
          s.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/143.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9",
          })

          r = s.get(page, timeout=30)
          r.raise_for_status()
          p = LexborHTMLParser(r.text)
          button = p.css_first("a.accent_bg")
          if button is None or not button.attributes.get("href"):
              raise SystemExit("APKMirror: first download button not found")

          stage2 = requests.compat.urljoin(page, button.attributes["href"])
          r = s.get(stage2, timeout=30)
          r.raise_for_status()
          p = LexborHTMLParser(r.text)

          # APKMirror's final page currently exposes the actual file link in
          # the notes area. Keep a broader fallback for minor HTML changes.
          link = p.css_first("p.notes:nth-child(3) > span:nth-child(1) > a:nth-child(1)")
          if link is None:
              candidates = [
                  a for a in p.css("a")
                  if a.attributes.get("href")
                  and (
                      "key=" in a.attributes["href"]
                      or "/wp-content/" in a.attributes["href"]
                      or "download.php" in a.attributes["href"]
                  )
              ]
              link = candidates[0] if candidates else None

          if link is None or not link.attributes.get("href"):
              raise SystemExit("APKMirror: final APK link not found")

          final_url = requests.compat.urljoin(stage2, link.attributes["href"])
          print("Final APK URL resolved.")

          out = Path("upstream/VK-Video-1.163-original.apk")
          with s.get(final_url, stream=True, timeout=60) as resp:
              resp.raise_for_status()
              with out.open("wb") as fh:
                  for chunk in resp.iter_content(1024 * 1024):
                      if chunk:
                          fh.write(chunk)

          print(f"Downloaded {out.stat().st_size} bytes")
          PY

          test -s upstream/VK-Video-1.163-original.apk

      - name: Verify upstream APK
        id: verify
        run: |
          set -euo pipefail
          APK=upstream/VK-Video-1.163-original.apk

          BADGING="$(aapt dump badging "$APK" | head -n1)"
          echo "$BADGING"

          VERSION="$(grep -o "versionName='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"
          VERSION_CODE="$(grep -o "versionCode='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"
          PACKAGE="$(grep -o "name='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"

          CERT="$(apksigner verify --print-certs "$APK"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             | head -n1 | tr '[:upper:]' '[:lower:]')"

          echo "Package: $PACKAGE"
          echo "Version: $VERSION ($VERSION_CODE)"
          echo "Certificate: $CERT"

          [[ "$PACKAGE" == "$PACKAGE_NAME" ]]
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$VERSION_CODE" == "$EXPECTED_VERSION_CODE" ]]
          [[ "$CERT" == "$EXPECTED_CERT_SHA256" ]]

          sha256sum "$APK" | tee upstream/original.sha256

      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Download Morphe Desktop
        run: |
          set -euo pipefail
          curl -fL --retry 4             -o morphe.jar             "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "${MORPHE_SHA256}  morphe.jar" | sha256sum -c -

      - name: Apply Variant 5 patches
        run: |
          set -euo pipefail
          mkdir -p dist
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"

          "$JAVA_HOME/bin/java" -jar morphe.jar patch             -p "$MPP"             --force             --exclusive             -e "Fix install conflict with stock VK"             -e "Bypass native signature check"             -e "Disable in-app update"             -e "Remove video ads"             -e "Hide promoted banner content"             -e "Disable ad pixel tracking"             --bytecode-mode STRIP_FAST             --unsigned             -r dist/patch-result.json             -o dist/unsigned.apk             upstream/VK-Video-1.163-original.apk

      - name: Sign exactly like tested Variant 5
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > signing.jks
          test -s signing.jks

          zipalign -f -p 4 dist/unsigned.apk dist/aligned.apk

          apksigner sign             --ks signing.jks             --ks-pass env:STORE_PASSWORD             --ks-key-alias "$KEY_ALIAS"             --key-pass env:KEY_PASSWORD             --v1-signing-enabled false             --v2-signing-enabled false             --v3-signing-enabled true             --v4-signing-enabled false             --out dist/VK-Video-1.163-patched.apk             dist/aligned.apk

          zipalign -c -p 4 dist/VK-Video-1.163-patched.apk
          apksigner verify --verbose --print-certs dist/VK-Video-1.163-patched.apk

          BADGING="$(aapt dump badging dist/VK-Video-1.163-patched.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='${PACKAGE_NAME}'" <<< "$BADGING"
          grep -q "versionName='${EXPECTED_VERSION}'" <<< "$BADGING"
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" <<< "$BADGING"

          sha256sum dist/VK-Video-1.163-patched.apk             | tee dist/VK-Video-1.163-patched.sha256

      - name: Replace GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload 1.163             dist/VK-Video-1.163-patched.apk             dist/VK-Video-1.163-patched.sha256             dist/patch-result.json             --clobber             --repo "$GITHUB_REPOSITORY"

          gh release edit 1.163             --repo "$GITHUB_REPOSITORY"             --title "VK Video 1.163 patched"             --notes "Tested Variant 5 build.

          Upstream: APKMirror / VK LLC
          VK Video: 1.163 (51921)
          Includes stock-VK coexistence fix, native libvkcore signature-check bypass, disabled in-app updates, video ads, promoted banner content and ad pixel tracking.
          Built with Morphe STRIP_FAST, zipaligned and signed v3-only with the project's persistent release key."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vk-video-1.163-replacement
          path: |
            upstream/original.sha256
            dist/patch-result.json
            dist/VK-Video-1.163-patched.sha256
          if-no-files-found: warn
