name: VK Video auto build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild and replace the current release even if this VK Video version already exists'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'ci/gplaydl-api-key.enc'
      - '.github/workflows/auto-update.yml'

permissions:
  contents: write
  packages: read
  issues: write

concurrency:
  group: vk-video-auto-build
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.vk.vkvideo
  BASELINE_VERSION: '1.163'
  BASELINE_VERSION_CODE: '51920'
  EXPECTED_CERT_SHA256: 057d974412032066f1b5edb1fdb550f71854189815c806b27c4d486fb4f1ef32

  GPLAYDL_VERSION: '4.2.1'
  APKEEP_VERSION: '1.0.0'
  APKEEP_SHA256: a23579a3ba366d25a6d69848189b983d65662f4ecf4b9e11e16510811659de4e
  APKEDITOR_VERSION: '1.4.1'

  RUSTORE_DOWNLOADER_VERSION: v1.4.0
  RUSTORE_DOWNLOADER_SHA256: 8ba94847a616b7b5d032285141253b8e3e2cb79d1119b827f558d48b6a157ca0

  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  build:
    if: github.repository == 'Solvo37/vk-video-morphe-patches' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Install Android verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq unzip zip

      - name: Load linked Google Play credential
        env:
          ENC_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # A manually configured repository secret wins.
          if [[ -n "${GPLAYDL_API_KEY:-}" ]]; then
            echo "Using GPLAYDL_API_KEY repository secret."
            exit 0
          fi

          if [[ ! -s ci/gplaydl-api-key.enc ]]; then
            echo "No linked Google Play credential found; public fallbacks will be used."
            exit 0
          fi

          KEY="$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A             -in ci/gplaydl-api-key.enc             -pass env:ENC_PASSWORD)"

          if [[ -z "$KEY" ]]; then
            echo "Could not decrypt linked Google Play credential." >&2
            exit 1
          fi

          echo "::add-mask::$KEY"
          echo "GPLAYDL_API_KEY=$KEY" >> "$GITHUB_ENV"
          unset KEY
          echo "Loaded encrypted Google Play credential."

      - name: Install download tools
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check "gplaydl==${GPLAYDL_VERSION}"

          curl -fL --retry 4             -o apkeep             "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          echo "${APKEEP_SHA256}  apkeep" | sha256sum -c -
          chmod +x apkeep

          curl -fL --retry 4             -o rustore-downloader.tar.gz             "https://github.com/RD2W/rustore-apk-downloader/releases/download/${RUSTORE_DOWNLOADER_VERSION}/RuStore_ApkDownloader_${RUSTORE_DOWNLOADER_VERSION}_linux-x86_64.tar.gz"
          echo "${RUSTORE_DOWNLOADER_SHA256}  rustore-downloader.tar.gz" | sha256sum -c -
          mkdir -p tools/rustore
          tar -xzf rustore-downloader.tar.gz -C tools/rustore
          chmod +x tools/rustore/rustore_apk_downloader

      - name: Download newest available upstream
        id: download
        run: |
          set -euo pipefail
          rm -rf upstream
          mkdir -p upstream

          SOURCE=""

          # Primary: RuStore. VK Video releases are expected to appear here first.
          # Query metadata before downloading so an unexpectedly stale RuStore build
          # can still fall through to the secondary sources instead of downgrading.
          echo "Checking RuStore first..."
          if tools/rustore/rustore_apk_downloader -j "${PACKAGE_NAME}" > rustore-meta.json 2>/dev/null; then
            RUSTORE_VERSION="$(jq -r '.version_name // empty' rustore-meta.json)"
            RUSTORE_VERSION_CODE="$(jq -r '.version_code // empty' rustore-meta.json)"
            RUSTORE_CERT="$(jq -r '.signature // empty' rustore-meta.json | tr '[:upper:]' '[:lower:]')"

            echo "RuStore reports: ${RUSTORE_VERSION:-unknown} (${RUSTORE_VERSION_CODE:-unknown})"

            if [[ -n "$RUSTORE_VERSION_CODE" ]] \
              && [[ "$RUSTORE_VERSION_CODE" =~ ^[0-9]+$ ]] \
              && (( RUSTORE_VERSION_CODE >= BASELINE_VERSION_CODE )) \
              && [[ "$RUSTORE_CERT" == "${EXPECTED_CERT_SHA256}" ]]; then
              echo "Using RuStore as upstream."
              mkdir -p upstream/rustore
              if tools/rustore/rustore_apk_downloader "${PACKAGE_NAME}" upstream/rustore; then
                SOURCE="rustore"
              else
                echo "::warning::RuStore metadata was valid but APK download failed; trying Google Play."
                rm -rf upstream/rustore
              fi
            else
              echo "::warning::RuStore build is below baseline or metadata/signature is invalid; trying secondary sources."
            fi
          else
            echo "::warning::RuStore metadata query failed; trying secondary sources."
          fi

          # Fallback 1: Google Play.
          if [[ -z "$SOURCE" && -n "${GPLAYDL_API_KEY:-}" ]]; then
            echo "Trying Google Play via gplaydl..."
            mkdir -p upstream/google-play
            if gplaydl download "${PACKAGE_NAME}" \
                --arch arm64 \
                --no-extras \
                -o upstream/google-play; then
              SOURCE="google-play"
            else
              echo "::warning::Google Play download failed; trying APKPure."
              rm -rf upstream/google-play
            fi
          elif [[ -z "$SOURCE" ]]; then
            echo "::notice::Google Play credential is not configured; trying APKPure."
          fi

          # Fallback 2: APKPure.
          if [[ -z "$SOURCE" ]]; then
            echo "Trying APKPure via apkeep..."
            mkdir -p upstream/apkpure
            if ./apkeep -a "${PACKAGE_NAME}" -d apk-pure upstream/apkpure; then
              SOURCE="apkpure"
            else
              echo "::error::All upstream sources failed."
              rm -rf upstream/apkpure
              exit 1
            fi
          fi

          SOURCE_DIR="upstream/$SOURCE"

          # Expand XAPK/APKS archives if a fallback returned one.
          while IFS= read -r archive; do
            [[ -z "$archive" ]] && continue
            echo "Extracting $archive"
            tmp="${archive}.dir"
            mkdir -p "$tmp"
            unzip -q "$archive" -d "$tmp"
            find "$tmp" -type f -name '*.apk' -exec cp {} "$SOURCE_DIR"/ \;
            rm -rf "$tmp" "$archive"
          done < <(find "$SOURCE_DIR" -maxdepth 1 -type f \( -name '*.xapk' -o -name '*.apks' -o -name '*.apkm' \) -print)

          echo "Selected upstream source: $SOURCE"
          find "$SOURCE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate and verify base APK
        id: upstream
        env:
          SOURCE: ${{ steps.download.outputs.source }}
          SOURCE_DIR: ${{ steps.download.outputs.dir }}
        run: |
          set -euo pipefail

          BASE_APK=""
          while IFS= read -r candidate; do
            BADGING="$(aapt dump badging "$candidate" 2>/dev/null | head -n1 || true)"
            [[ "$BADGING" == package:* ]] || continue

            PKG="$(grep -o "name='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"
            [[ "$PKG" == "${PACKAGE_NAME}" ]] || continue

            if ! grep -q " split='" <<< "$BADGING"; then
              BASE_APK="$candidate"
              break
            fi
          done < <(find "$SOURCE_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)

          if [[ -z "$BASE_APK" ]]; then
            echo "Could not locate base APK" >&2
            exit 1
          fi

          BADGING="$(aapt dump badging "$BASE_APK" | head -n1)"
          echo "$BADGING"

          VERSION="$(grep -o "versionName='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"
          VERSION_CODE="$(grep -o "versionCode='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"
          PKG="$(grep -o "name='[^']*'" <<< "$BADGING" | head -n1 | cut -d"'" -f2)"

          [[ "$PKG" == "${PACKAGE_NAME}" ]]
          [[ -n "$VERSION" ]]
          [[ -n "$VERSION_CODE" ]]

          CERT="$(apksigner verify --print-certs "$BASE_APK"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             | head -n1 | tr '[:upper:]' '[:lower:]')"

          echo "Upstream source: $SOURCE"
          echo "VK Video: $VERSION ($VERSION_CODE)"
          echo "Certificate: $CERT"

          [[ "$CERT" == "${EXPECTED_CERT_SHA256}" ]]

          SHA256="$(sha256sum "$BASE_APK" | awk '{print $1}')"
          jq -n             --arg source "$SOURCE"             --arg package "${PACKAGE_NAME}"             --arg version "$VERSION"             --arg version_code "$VERSION_CODE"             --arg certificate_sha256 "$CERT"             --arg base_apk_sha256 "$SHA256"             '{
              source: $source,
              package: $package,
              version_name: $version,
              version_code: $version_code,
              certificate_sha256: $certificate_sha256,
              base_apk_sha256: $base_apk_sha256
            }' > upstream.json

          echo "base=$BASE_APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail

          LOWEST="$(printf '%s\n%s\n' "${BASELINE_VERSION}" "$VERSION" | sort -V | head -n1)"
          if [[ "$LOWEST" == "$VERSION" && "$VERSION" != "${BASELINE_VERSION}" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Newest available source is $VERSION, older than baseline ${BASELINE_VERSION}; refusing downgrade."
            exit 0
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$FORCE_REBUILD" == "true" ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Release $VERSION exists, but force_rebuild=true."
              exit 0
            fi

            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Build Morphe patch bundle
        if: steps.decision.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Locate MPP
        if: steps.decision.outputs.build == 'true'
        id: mpp
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          echo "path=$MPP" >> "$GITHUB_OUTPUT"

      - name: Install pinned Morphe Desktop
        if: steps.decision.outputs.build == 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 4             -o morphe.jar             "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "${MORPHE_SHA256}  morphe.jar" | sha256sum -c -

      - name: Patch base APK
        if: steps.decision.outputs.build == 'true'
        id: patch
        continue-on-error: true
        env:
          BASE_APK: ${{ steps.upstream.outputs.base }}
          MPP: ${{ steps.mpp.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist

          "$JAVA_HOME/bin/java" -jar morphe.jar patch             -p "$MPP"             --force             --exclusive             -e "Fix install conflict with stock VK"             -e "Bypass native signature check"             -e "Disable in-app update"             -e "Remove video ads"             -e "Hide promoted banner content"             -e "Disable ad pixel tracking"             --bytecode-mode STRIP_FAST             --unsigned             -r dist/patch-result.json             -o dist/patched-base.apk             "$BASE_APK"

      - name: Open compatibility issue on patch failure
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
        run: |
          set -euo pipefail
          TITLE="Compatibility: VK Video $VERSION ($VERSION_CODE)"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open             --search "$TITLE in:title" --json number --jq '.[0].number // empty')"

          BODY="Automated Morphe patching failed for VK Video **$VERSION** (versionCode **$VERSION_CODE**).

          Source APK passed package and VK-certificate verification, but one or more required fingerprints no longer apply.

          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create "$TITLE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi

      - name: Stop after incompatible update
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'failure'
        run: exit 1

      - name: Merge Google Play / XAPK splits
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success'
        env:
          SOURCE_DIR: ${{ steps.download.outputs.dir }}
          BASE_APK: ${{ steps.upstream.outputs.base }}
        run: |
          set -euo pipefail

          mkdir -p merge
          cp dist/patched-base.apk merge/base.apk

          while IFS= read -r split; do
            [[ "$split" == "$BASE_APK" ]] && continue
            cp "$split" "merge/$(basename "$split")"
          done < <(find "$SOURCE_DIR" -maxdepth 1 -type f -name '*.apk' -print)

          COUNT="$(find merge -maxdepth 1 -type f -name '*.apk' | wc -l)"
          echo "APK files to merge: $COUNT"

          if [[ "$COUNT" -gt 1 ]]; then
            curl -fL --retry 4               -o APKEditor.jar               "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar"

            java -jar APKEditor.jar m -i merge -o dist/unsigned-universal.apk
          else
            cp dist/patched-base.apk dist/unsigned-universal.apk
          fi

      - name: Decode signing keystore
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > signing.jks
          test -s signing.jks

      - name: Sign universal APK
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && env.HAS_SIGNING == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          OUT="dist/VK-Video-${VERSION}-patched.apk"
          ALIGNED="dist/aligned-universal.apk"

          zipalign -f -p 4 dist/unsigned-universal.apk "$ALIGNED"

          apksigner sign \
            --ks signing.jks \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT" \
            "$ALIGNED"

          zipalign -c -p 4 "$OUT"
          apksigner verify --verbose --print-certs "$OUT"

          BADGING="$(aapt dump badging "$OUT" | head -n1)"
          echo "$BADGING"
          grep -q "name='${PACKAGE_NAME}'" <<< "$BADGING"
          grep -q "versionName='${VERSION}'" <<< "$BADGING"

          sha256sum "$OUT" | tee "dist/VK-Video-${VERSION}-patched.sha256"

      - name: Upload build diagnostics
        if: steps.decision.outputs.build == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: vk-video-${{ steps.upstream.outputs.version }}-build
          path: |
            upstream.json
            dist/patch-result.json
            dist/VK-Video-*-patched.sha256
            patches/build/libs/*.mpp
          if-no-files-found: warn

      - name: Publish GitHub Release for Obtainium
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          SOURCE: ${{ steps.download.outputs.source }}
          MPP: ${{ steps.mpp.outputs.path }}
        run: |
          set -euo pipefail

          APK="dist/VK-Video-${VERSION}-patched.apk"
          SHA="dist/VK-Video-${VERSION}-patched.sha256"

          NOTES="Automated VK Video build.

          Upstream: $SOURCE
          VK Video: $VERSION ($VERSION_CODE)
          Upstream package and VK signing certificate were verified before patching.
          The final APK includes the native VK signature-check bypass, Morphe patches, split merge when needed, zipalign, and v3-only signing with the project's persistent release key."

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing release $VERSION..."
            gh release upload "$VERSION" \
              "$APK" "$SHA" "$MPP" "upstream.json" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"

            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VK Video $VERSION patched" \
              --notes "$NOTES"
          else
            echo "Creating release $VERSION..."
            gh release create "$VERSION" \
              "$APK#VK Video $VERSION patched APK" \
              "$SHA#SHA-256" \
              "$MPP#Morphe patch bundle" \
              "upstream.json#Upstream build metadata" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VK Video $VERSION patched" \
              --notes "$NOTES"
          fi

      - name: Signing setup reminder
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::Patching succeeded, but Android signing secrets are not configured. No public APK release was created."
