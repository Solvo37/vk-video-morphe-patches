name: VK Video upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/auto-update.yml'

permissions:
  contents: write
  packages: read
  issues: write

concurrency:
  group: vk-video-upstream
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.vk.vkvideo
  EXPECTED_CERT_SHA256: 057d974412032066f1b5edb1fdb550f71854189815c806b27c4d486fb4f1ef32
  RUSTORE_DOWNLOADER_VERSION: v1.4.0
  RUSTORE_DOWNLOADER_SHA256: 8ba94847a616b7b5d032285141253b8e3e2cb79d1119b827f558d48b6a157ca0
  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  check-patch-release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install APK verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner aapt jq

      - name: Install pinned RuStore downloader
        run: |
          set -euo pipefail
          curl -fL --retry 4             -o rustore-downloader.tar.gz             "https://github.com/RD2W/rustore-apk-downloader/releases/download/${RUSTORE_DOWNLOADER_VERSION}/RuStore_ApkDownloader_${RUSTORE_DOWNLOADER_VERSION}_linux-x86_64.tar.gz"
          echo "${RUSTORE_DOWNLOADER_SHA256}  rustore-downloader.tar.gz" | sha256sum -c -
          mkdir -p tools/rustore
          tar -xzf rustore-downloader.tar.gz -C tools/rustore
          chmod +x tools/rustore/rustore_apk_downloader
          tools/rustore/rustore_apk_downloader --version

      - name: Query latest VK Video from RuStore
        id: upstream
        run: |
          set -euo pipefail
          tools/rustore/rustore_apk_downloader -j "${PACKAGE_NAME}" > upstream.json
          cat upstream.json | jq .
          VERSION="$(jq -r '.version_name' upstream.json)"
          VERSION_CODE="$(jq -r '.version_code' upstream.json)"
          DOWNLOAD_URL="$(jq -r '.download_url // empty' upstream.json)"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "RuStore did not return a version" >&2
            exit 1
          fi
          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "RuStore reports no direct APK download for ${PACKAGE_NAME}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream APK
        if: steps.existing.outputs.skip != 'true'
        id: apk
        run: |
          set -euo pipefail
          mkdir -p upstream
          tools/rustore/rustore_apk_downloader "${PACKAGE_NAME}" ./upstream
          APK="$(find upstream -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Verify upstream identity
        if: steps.existing.outputs.skip != 'true'
        env:
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
        run: |
          set -euo pipefail
          BADGING="$(aapt dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          PKG="$(sed -n "s/.*name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VN="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VC="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          [[ "$PKG" == "${PACKAGE_NAME}" ]]
          [[ "$VN" == "$VERSION" ]]
          [[ "$VC" == "$VERSION_CODE" ]]

          CERT="$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          echo "VK certificate SHA-256: $CERT"
          [[ "$CERT" == "${EXPECTED_CERT_SHA256}" ]]

      - name: Build Morphe patch bundle
        if: steps.existing.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Locate MPP
        if: steps.existing.outputs.skip != 'true'
        id: mpp
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          echo "path=$MPP" >> "$GITHUB_OUTPUT"

      - name: Install pinned Morphe Desktop
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 4             -o morphe.jar             "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "${MORPHE_SHA256}  morphe.jar" | sha256sum -c -

      - name: Compatibility patch test
        if: steps.existing.outputs.skip != 'true'
        id: patch_test
        continue-on-error: true
        env:
          APK: ${{ steps.apk.outputs.path }}
          MPP: ${{ steps.mpp.outputs.path }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          java -jar morphe.jar patch             -p "$MPP"             --force             --exclusive             -e "Disable in-app update"             -e "Remove video ads"             -e "Hide promoted banner content"             -e "Disable ad pixel tracking"             --bytecode-mode FULL             --unsigned             -r dist/patch-result.json             -o "dist/VK-Video-${VERSION}-compatibility-test.apk"             "$APK"

      - name: Open compatibility issue on failure
        if: steps.existing.outputs.skip != 'true' && steps.patch_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
        run: |
          set -euo pipefail
          TITLE="Compatibility: VK Video $VERSION ($VERSION_CODE)"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          BODY="Automated Morphe compatibility patch failed for VK Video **$VERSION** (versionCode **$VERSION_CODE**).

          The upstream APK passed package/version/certificate verification, but at least one patch/fingerprint no longer applies.

          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Stop after incompatible update
        if: steps.existing.outputs.skip != 'true' && steps.patch_test.outcome == 'failure'
        run: |
          echo "Patch fingerprints need updating for VK Video ${{ steps.upstream.outputs.version }}." >&2
          exit 1

      - name: Decode signing keystore
        if: steps.existing.outputs.skip != 'true' && steps.patch_test.outcome == 'success' && env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > signing.jks
          test -s signing.jks

      - name: Build signed APK
        if: steps.existing.outputs.skip != 'true' && steps.patch_test.outcome == 'success' && env.HAS_SIGNING == 'true'
        env:
          APK: ${{ steps.apk.outputs.path }}
          MPP: ${{ steps.mpp.outputs.path }}
          VERSION: ${{ steps.upstream.outputs.version }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          java -jar morphe.jar patch             -p "$MPP"             --force             --exclusive             -e "Disable in-app update"             -e "Remove video ads"             -e "Hide promoted banner content"             -e "Disable ad pixel tracking"             --bytecode-mode FULL             --keystore "$PWD/signing.jks"             --keystore-password "$STORE_PASSWORD"             --keystore-entry-alias "$KEY_ALIAS"             --keystore-entry-password "$KEY_PASSWORD"             --signer "Solvo37 VK Video"             -o "dist/VK-Video-${VERSION}-patched.apk"             "$APK"
          apksigner verify --verbose "dist/VK-Video-${VERSION}-patched.apk"

      - name: Upload compatibility artifacts
        if: steps.existing.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-video-${{ steps.upstream.outputs.version }}-check
          path: |
            upstream.json
            dist/patch-result.json
            patches/build/libs/*.mpp
          if-no-files-found: warn

      - name: Publish GitHub Release for Obtainium
        if: steps.existing.outputs.skip != 'true' && steps.patch_test.outcome == 'success' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          MPP: ${{ steps.mpp.outputs.path }}
        run: |
          set -euo pipefail
          APK="dist/VK-Video-${VERSION}-patched.apk"
          gh release create "$VERSION"             "$APK#VK Video $VERSION patched APK"             "$MPP#Morphe patch bundle"             "upstream.json#RuStore upstream metadata"             --repo "$GITHUB_REPOSITORY"             --title "VK Video $VERSION patched"             --notes "Automated build from the official RuStore VK Video $VERSION (versionCode $VERSION_CODE). Upstream package and VK signing certificate were verified before patching. Patched APK is signed with the repository owner's persistent signing key for Obtainium updates."

      - name: Signing setup reminder
        if: steps.existing.outputs.skip != 'true' && steps.patch_test.outcome == 'success' && env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::Compatibility check passed, but signing secrets are not configured. No GitHub Release was published for Obtainium."
