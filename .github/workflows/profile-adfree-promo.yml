name: Trace profile ad-free promo

on:
  push:
    branches:
      - ad-analysis-1.163
    paths:
      - '.github/workflows/profile-adfree-promo.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ad-analysis-1.163
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download RC and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf profilepromo
          mkdir -p profilepromo docs
          gh release download 1.163.5-rc1 --repo "$GITHUB_REPOSITORY" --pattern 'VK-Video-1.163.5-rc1-patched.apk' --dir profilepromo
          URL="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)"
          curl -fL --retry 4 "$URL" -o profilepromo/jadx.zip
          unzip -q profilepromo/jadx.zip -d profilepromo/jadx
          chmod +x profilepromo/jadx/bin/jadx
      - name: Decode resources and sources
        run: |
          set -euo pipefail
          profilepromo/jadx/bin/jadx -j 4 -d profilepromo/out profilepromo/VK-Video-1.163.5-rc1-patched.apk >/tmp/jadx-profilepromo.log 2>&1 || true
          test -d profilepromo/out
      - name: Find profile ad-free promo
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('profilepromo/out')
          out=Path('docs/profile-adfree-promo-1.163.5-rc1.txt')
          needles=[
            'Отключить рекламу',
            'Бесплатно на 14 дней',
            '14 дней',
            'disable ads',
            'ad free',
            'ad_free',
            'without ads',
            'no ads',
            'trial',
            'OnboardingPromo',
            'subscription',
            'subscription promo',
            'MyPage',
            'Profile',
          ]
          hits=[]
          for p in root.rglob('*'):
            if not p.is_file(): continue
            if p.suffix.lower() not in ('.java','.xml','.json','.txt','.smali'): continue
            try:t=p.read_text('utf-8',errors='replace')
            except:continue
            found=[n for n in needles if n.lower() in t.lower()]
            if not found: continue
            score=sum(t.lower().count(n.lower()) for n in found)
            if 'Отключить рекламу' in t: score += 100
            if 'Бесплатно на 14 дней' in t: score += 100
            hits.append((score,p,t,found))
          hits.sort(key=lambda x:(-x[0],str(x[1])))
          with out.open('w',encoding='utf-8') as f:
            f.write(f'# hits={len(hits)}\n\n')
            for score,p,t,found in hits[:250]:
              lines=t.splitlines()
              f.write(f'===== {p.relative_to(root)} score={score} =====\nHITS: {", ".join(found)}\n')
              idxs=[i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in found)]
              windows=[]
              for i in idxs:
                a,b=max(0,i-35),min(len(lines),i+70)
                if windows and a<=windows[-1][1]+5: windows[-1]=(windows[-1][0],max(windows[-1][1],b))
                else: windows.append((a,b))
              for a,b in windows[:20]:
                f.write(f'--- lines {a+1}-{b} ---\n')
                for j in range(a,b):
                  f.write(f'{j+1:05d}: {lines[j]}\n')
              f.write('\n')
          print(out, out.stat().st_size)
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/profile-adfree-promo-1.163.5-rc1.txt
          git commit -m 'analysis: trace profile ad-free promo' || exit 0
          git pull --rebase origin ad-analysis-1.163
          git push origin HEAD:ad-analysis-1.163
